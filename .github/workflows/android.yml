name: Android build

on:
  workflow_dispatch:
  pull_request:
    paths: ['app/**', 'build.gradle', 'settings.gradle', 'android-signing/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['app/**', 'build.gradle', 'settings.gradle', 'android-signing/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build signed APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Name the APK
        id: apk
        run: |
          V=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          cp app/build/outputs/apk/release/app-release.apk "Delvers-$V.apk"
          echo "name=Delvers-$V.apk" >> "$GITHUB_OUTPUT"
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs "Delvers-$V.apk" | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: Delvers-android-apk
          path: ${{ steps.apk.outputs.name }}
      - name: Publish to the android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "Delvers for Android (latest)" --notes "Latest Android build of the main branch. Download the APK and install it (allow installs from this source)."
          for f in $(gh release view android-latest --json assets -q '.assets[].name'); do gh release delete-asset android-latest "$f" -y; done
          gh release upload android-latest "${{ steps.apk.outputs.name }}" --clobber
