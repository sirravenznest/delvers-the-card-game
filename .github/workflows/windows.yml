name: Windows build

on:
  workflow_dispatch:
  pull_request:
    paths: ['windows/**', 'app/src/main/assets/index.html', '.github/workflows/windows.yml']
  push:
    branches: [main]
    paths: ['windows/**', 'app/src/main/assets/index.html', '.github/workflows/windows.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Delvers-windows-portable
          path: windows/dist/*.exe
      - name: Publish to the windows-latest release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows-latest >/dev/null 2>&1 || gh release create windows-latest --title "Delvers for Windows (latest)" --notes "Portable Windows build of the current main branch. Download the .exe and double-click to play."
          gh release upload windows-latest dist/*.exe --clobber
