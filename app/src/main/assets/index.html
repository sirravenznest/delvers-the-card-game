['Gnarlfang, Goblin Chieftain',20,1,1,75,0,['T','F','B'],'Chieftain of the Gutterband','Act I · The Underhalls','Gnarlfang united the goblin tribes with the Roar, a war-frenzy that spreads through the drums. His wolves and ogres hold the last stairway out of the warrens. Behind him the air tastes of old smoke.','The drums fall silent. In Gnarlfang’s trophy pile you find a cold, whispering shard stamped with the Pale Court’s mark.','“ROAR! The Delver breaks like all the others!”'],

['Brother Malachar',24,1,2,110,0,['C','U'],'Ashen Confessor','Act II · The Hollow Court','Brother Malachar once burned heretics for the Ember Faith. The Hollow took him, and now he preaches that the Dusk is mercy. His pilgrims shamble in a procession of ash and candle-smoke.','Malachar kneels in the ash. “The light … was only ever a fire. Let it be a good one.” His censer rolls to your feet, still warm.','“Be still, child. The Dusk forgives everything.”'],
['Dugash the Warchief',26,2,2,130,1,['F','G','B'],'Warchief of the Ironmaw Clans','Act III · The Deep Roads','The Tuskborn clans of the Ironmaw were honourable once. Then they swore a hunger-oath to the Hollow. Dugash now marches the whole host toward Hallowspire, and only the Deep Roads stand between them and the Throne.','Dugash drops to one knee. “You fight with honour. The pact took mine.” He breaks his axe and lets you pass, though the host marches on.','“Blood and iron! Your skull will hold my wine!”'],

['Sylra, Dark Elf Matron',30,2,3,180,1,['T','W','B'],'Matron of the Spiderthrone','Act III · The Deep Roads','In the Lowdeep, Matron Sylra spins webs of Hollow-silk and sells secrets to every side. She sold the Hollow Seal’s location to the Ironmaw host. She will sell yours too.','Sylra shrugs as her webs burn. “Business is business, Delver. Take this. It is a gift, not a bribe.” It is the key to the Conclave’s foundry.','“Everyone is for sale, little Delver. Even you.”'],

['Lord Vexmoor, the Hollow Marshal',34,3,3,250,2,['U','F'],'Marshal Fallen to the Hollow','Act IV · The Emberheart','Marshal Vexmoor held the Hollow Seal for three hundred years. When it cracked, he swore himself to the Hollow to save his men. He now leads them as undead, still saluting the dead Throne.','Vexmoor’s helm clatters across the stones. “At last,” he whispers. His honour guard salutes and falls to dust.','“I held the line for the Throne. I will hold it against you.”'],
['Ignarra the Wyrm Queen',36,3,3,280,2,['D','F','W'],'Wyrm Queen of the Cinder Brood','Act IV · The Emberheart','Ignarra believes the Emberheart’s light is stolen dragonfire and that she is its rightful owner. She nests in the Ember Vault and her brood circles overhead like a storm.','The Wyrm Queen’s fire gutters. “Take the light, then. See what it costs.” Behind her, the Emberheart’s heart beats weakly.','“Kneel, little ember. I will warm myself on your ashes.”'],
['Tharaxis the Ancient',40,3,3,350,2,['D','G','E'],'The Ancient, Last Dusk-Drake','Act V · The Long Dusk','Tharaxis is older than the Throne and has gnawed at the Emberheart since the First Age. He is the Dusk made flesh. The Delvers’ Guild has one last writ: cut down the Ancient and rekindle the light.','The Ancient falls and the Emberheart flares, spilling light into every hall of Vaelmark. But the Hollow does not bleed from the Seal alone. Something deeper is calling, and the Guild’s maps lead down, beyond the edge of the charts.','“I was old when the Emberheart was young. You are a spark.”'],
['Nyx the Gloom-Weaver',40,3,3,400,2,['W','T','U'],'Shadow-Weaver of the Reaches','Act VI · The Hollow Reaches','Beyond the Seal the stairs end and the Hollow Reaches begin: a land of black glass and drifting lamp-wisps. Nyx stitches shadows into soldiers and trades the names of the dead for power. She has been expecting you for a very long time.','Nyx unravels into thread. “You carry too much light to be stitched,” she sighs. The Reaches grow a little brighter.','“Every shadow is a door. Let me show you yours.”'],
['Gorrash Bonecrusher',42,3,3,430,2,['G','B','F'],'Ogre-King of the Marrow Pits','Act VI · The Hollow Reaches','Gorrash rules the Marrow Pits, an arena of bone where the Hollow’s captives fight for scraps. He has eaten three champions and a dragon’s egg, and he is still hungry.','Gorrash’s crown cracks. “Strong little thing,” he rumbles, and opens the pit gates for the captives behind you.','“Fresh meat! Make it loud!”'],
['Archivist Quellon',44,3,3,460,2,['W','K','E'],'Keeper of the Drowned Archive','Act VII · The Drowned Archive','A vault-city of sunken libraries lies under the Reaches, flooded by a dead sea. Quellon, a construct-scholar, has catalogued every spell ever cast and intends to file you under “Fuel”.','Quellon’s pages scatter on the tide. “Entry updated,” it whispers. “Delver: unexpectedly capable.”','“Silence in the Archive. Resistance is a clerical error.”'],
['Kraalu the Tidecaller',46,3,3,490,2,['E','B','D'],'Leviathan-Priest of the Deep','Act VII · The Drowned Archive','Kraalu worships the thing that sleeps under the Archive’s lowest floor. He calls the sea-wyrms with a conch carved from a dragon’s skull, and the water answers.','The conch cracks and the tide pulls back. Kraalu bows to you, then to the dark water, and sinks.','“The deep is patient. The deep is hungry.”'],
['Thessaly, Thorn-Queen',48,3,3,520,2,['R','B','E'],'Thorn-Queen of the Gloamwood','Act VIII · The Gloamwood','The Hollow has crept up into the world’s oldest forest and turned it sour. Thessaly was its guardian. Now she wears the forest like armour, and every branch carries her will.','The thorns wither and the forest breathes again. “Forgive me,” Thessaly says, “I forgot what the light looked like.”','“The forest remembers every axe. It will remember you.”'],
['Ashgrove, the Antlered King',50,3,3,550,2,['B','R','G'],'Hollow Stag of the Gloamwood','Act VIII · The Gloamwood','Ashgrove is a stag the size of a cathedral, crowned with antlers of black flame. The Hollow whispers through him; the Gloamwood’s beasts follow him blindly toward Hallowspire.','Ashgrove kneels and the black flame gutters from his antlers. The beasts of the Gloamwood scatter, free at last.','“Run, little one. The herd is behind you.”'],

['Aurelian the Undying',56,3,3,800,3,['F','C','W','D'],'The God-King, Hollowed','Act IX · The Starless Throne','Aurelian has sat the Ember Throne for ten thousand years. To keep the Emberheart burning he fed it the realm’s souls, then his own, then the Hollow’s. What sits the Starless Throne now is no god and no king. You are the Guild’s last writ.','The Hollow God-King falls, and the Throne’s crown with him. The Emberheart steadies, no longer fed on souls. Vaelmark’s long night is over. Your legend is written, Delver.','“I was a god when your ancestors were mud. Kneel, spark.”']

 const groups=[false,true].map(graphic=>{const choices=DelversEmotes.list.filter(e=>!!e.pixels==graphic&&S.cosmetics.emotes.includes(e.id));return choices.length?`<h3>${graphic?'Graphics':'Text phrases'}</h3><div class="emoteChoices">${choices.map(e=>`<button class="btn" data-a="emotesend" data-k="${e.id}">${DelversEmotes.art(e)}<span><b>${e.name}</b><small>${e.text}</small></span></button>`).join('')}</div>`:''}).join('');
 return (e?`<aside class="emoteBubble ${b.side}" role="status"><b>${b.side=='p'?'You':esc(G.opp.n.split(' · ⏱')[0])}</b>${DelversEmotes.art(e)}<span>${e.text}</span></aside>`:'')+(V.emoteOpen?`<div class="emoteShade"><section id="emoteDialog" class="emoteMenu" role="dialog" aria-modal="true" aria-labelledby="emoteTitle"><header><h2 id="emoteTitle">Battle emotes</h2><button class="btn" data-a="emotetoggle" aria-label="Close emotes">Close</button></header><div class="emotePickerScroll sc v">${SB('y','Scroll emotes up')}${groups}${SA('y','Scroll emotes down')}</div><footer><small>One emote every 3 seconds. Optional graphics are in Store.</small>${emoteMuteHTML()}${V.emoteErr?`<p role="alert">${esc(V.emoteErr)}</p>`:''}</footer></section></div>`:'')}
function combatLogHTML(){
 if(!V.logOpen)return'';
 const labels={turn:'Turn',roll:'Roll',damage:'Damage',heal:'Healing',attack:'Attack',move:'Move',spell:'Spell',summon:'Summon',status:'Status',result:'Result',info:'Info'},filters={all:null,roll:['roll'],health:['damage','heal'],actions:['attack','move','spell','summon','result']},filter=filters[V.logFilter]||null;
 let turn=null;
 const entries=(G.history||[]).filter(h=>!filter||filter.includes(h.kind)).map(h=>{const heading=h.turn!==turn?`<li class="logTurn">Turn ${h.turn} · ${h.turnSide=='p'?'Your turn':'Foe turn'}</li>`:'';turn=h.turn;return heading+`<li class="logEvent event-${h.kind}"><small>#${h.id}</small><b class="logSide-${h.side}">${h.side=='p'?'You':'Foe'}</b><span class="logKind">${labels[h.kind]||'Info'}</span><span>${esc(h.text)}</span></li>`}).join('');
 return `<div class="logShade"><section id="battleLog" role="dialog" aria-modal="true" aria-labelledby="combatLogTitle"><header><h2 id="combatLogTitle">Combat log</h2><button class="btn" data-a="logtoggle" aria-label="Close combat log">Close</button></header><p>Oldest to newest. ${G.over?'Battle over.':'The battle continues while reviewing.'} ${G.historyDropped?`Earlier entries trimmed; latest ${DelversEngine.LOG_LIMIT} events retained.`:'Available until you leave this battle.'}</p><div class="logTools">${[['all','All events'],['roll','Rolls'],['health','HP changes'],['actions','Actions']].map(([k,n])=>`<button class="btn" data-a="logfilter" data-k="${k}" aria-pressed="${(V.logFilter||'all')==k}">${n}</button>`).join('')}<button class="btn" data-a="loglatest" aria-pressed="${!!V.logFollow}">${V.logFollow?'Following latest':'Follow latest'}</button></div><ol class="logEntries sc v" tabindex="0" aria-label="Combat history">${entries||'<li class="logEmpty">No matching events yet.</li>'}</ol></section></div>`;
}
function showEmote(id,side){if(!G||G.tut||G.over||side=='e'&&S.emotesMuted)return;const b=V.emoteBubble={id,side,at:Date.now()};setTimeout(()=>{if(G&&V.emoteBubble===b){V.emoteBubble=null;render()}},4500)}
function closeEmoteDialog(){const id=V.emotePreview;V.emotePreview=null;V.emoteOpen=false;render();$app.querySelector(id?`[data-a="emotepreview"][data-k="${id}"]`:'[data-a="emotetoggle"]')?.focus({preventScroll:true})}
async function sendEmote(id){if(!G||G.tut||G.over)return;const e=DelversEmotes.byId[id];if(!e||!S.cosmetics.emotes.includes(id)){V.emoteErr='Unlock that emote in the Store first.';render();return}
 if(Date.now()-(V.emoteLast||0)<DelversEmotes.COOLDOWN_MS){V.emoteErr='Please wait 3 seconds between emotes.';render();return}
 const game=G,mid=game.pvp&&V.pv?.mid,sameBattle=()=>G===game||!!(mid&&G?.pvp&&V.pv?.mid===mid),at=Date.now();V.emoteLast=at;V.emoteErr='';
 try{if(G.pvp)await NET.sendEmote(id);else showEmote(id,'p');if(!sameBattle())return;V.emoteOpen=false;
  if(!G.pvp&&id=='hello'){setTimeout(()=>{if(G===game){showEmote('hello','e');render()}},2000)}
 }catch(e){if(!sameBattle())return;if(V.emoteLast==at)V.emoteLast=0;V.emoteErr='Emote could not be sent: '+e.message}
 if(G){render();if(!V.emoteOpen)$app.querySelector('[data-a="emotetoggle"]')?.focus({preventScroll:true})}}
function gameHTML(){const P=G.p,E=G.e,sel=G.sel,sp=sel&&sel.m=='spell'?sel.c:null,un=sel&&sel.m=='unit'?sel.c:null,up=un?G.b.indexOf(un):-1,pl=sel&&sel.m=='place',mine=G.turn=='p'&&!G.over;
 const hl=(side,c)=>sp&&ok(sp.tg,'p',{side,c},sp)?'tgt':'';
 const hh=un&&un.ready&&row(up)<un.rch;
 const bd=G.b.map((u,i)=>{if(!u){const m=(un&&dist(up,i)<=un.mv)||(pl&&row(i)==ROWS-1),home=row(i)==0?'foeHome':row(i)==ROWS-1?'yourHome':'';
  return `<button class="tile ${home} ${m?'mv':''}" data-a="cell" data-i="${i}" aria-label="Empty tile, row ${row(i)+1}, column ${i%COLS+1}${home?', '+(home=='foeHome'?'opponent':'your')+' deployment row':''}${m?pl?', place here':', move here':''}">${m?(pl?'Place here':'Move here'):home=='foeHome'?'Foe deploy':home=='yourHome'?'Your deploy':''}</button>`}
  const inr=un&&u.o=='e'&&un.ready&&dist(up,i)<=un.rch,tg=hl(u.o,u)||(inr?'tgt':'');
  const cl=(u.o=='p'&&mine&&(u.mv>0||u.ready)&&!sel?'ready ':'')+(sel&&sel.c===u?'sel ':'')+(u.sleep||(u.o=='p'&&mine&&!u.ready&&u.mv<=0)?'done ':'')+tg;
  const marks=tagsHTML(u,true)+(u.sleep?'<span class="abilityTag" title="Asleep" aria-label="Asleep">💤</span>':'');
  return `<button class="tile u ${u.o} ${cl}${lookClass(u)}" style="--k:${CL[u.cls][1]};--rar:${RC[u.rar]}" data-a="cell" data-i="${i}" data-z="${u.name}" aria-label="${u.o=='p'?'Your unit':'Opponent unit'}: ${u.name}. ${CLASS[u.cls]||CL[u.cls][0]}. ${RN[u.rar]}. Attack ${u.atk}, health ${u.hp} of ${u.mhp}, Guard ${u.ac}, Aim ${u.thac0}, movement ${u.mv} of ${u.init}, Save ${u.save}. ${esc(gearSummary(u))}.">${finishHTML(u)}<span class="tileHeader"><span class="tileOwner">${u.o=='p'?'YOU':'FOE'}</span><b class="tileName">${u.name}</b>${gearHTML(u)}</span><i class="hit" style="${inr?'':'display:none'}">Hit ${inr?need(un,u.ac):''}+</i>${statsHTML(u)}<span class="ab">${marks}</span></button>`}).join('');
 const pr=(G.over?'':G.turn=='e'?'Foe is acting… please wait.':G.msg||(pl?'Tap a glowing tile on your back row (bottom).':sp?`Choose a target for ${sp.name}.`:un?`Tap a yellow tile to move (${un.mv} initiative left)${un.ready?', or a red target to attack':''}.`:'Play a green-bordered hand card, or select one of your blue YOU units.'))+(un&&equippedGear(un).length?`<p class="selectedGear"><b>Equipped:</b> ${esc(gearSummary(un))}. Hold unit for gear effects.</p>`:'');
 const hd=P.hand.map((c,i)=>{const playable=mine&&!G.busy&&canPlay(c),selected=sel&&sel.c===c;
  const state=G.over?'Battle over':!mine?'Foe’s turn':G.busy?'Please wait':c.cost>P.mp?`Need ${c.cost-P.mp} mana`:!playable?(c.t=='c'?'Back row full':'No valid target'):selected?'SELECTED':'PLAYABLE';
  return card(c,`data-a="hand" data-i="${i}" data-play-state="${esc(state)}" aria-label="${esc(c.name+'. '+RN[c.rar]+'. '+state)}" aria-disabled="${!playable}"`,(selected?'sel ':'')+(playable?'can ':'dim ')+(c.cost>P.mp?'no':''),null,true)}).join('');
 const idle=mine&&!G.busy&&!P.hand.some(canPlay)&&!units('p').some(u=>u.ready);
 const playerName=UN()||'Delver',foeName=G.opp.n;
 const identity=(side,name,avatar,X)=>`<button class="battleIdentity ${side} ${hl(side=='you'?'p':'e',null)||(side=='foe'&&hh?'tgt':'')}" data-a="${side=='you'?'p':'e'}hero" aria-label="${side=='you'?'Your':'Opponent'} hero: ${esc(name)}. Health ${X.hp} of ${X.mx}. Mana ${X.mp} of ${X.max}.">${portrait(avatar,'portraitSm')}<span class="battleProfile"><small>${side=='you'?'YOU':G.pvp&&G.opp.bot?'FOE · BOT':'FOE'}</small><strong class="battlePlayerName">${esc(name)}</strong></span><span class="heroResources"><span class="heroHp"><small>HP</small><b>${X.hp}</b></span><span class="heroMana"><small>MANA</small><b>${X.mp}/${X.max}</b></span></span></button>`;
 const tb=`<div class="turn ${G.over?'over':mine?'you':'foe'}">${identity('you',playerName,S.avatar||'vanguard',P)}<div class="turnCenter"><strong class="turnState" role="status" aria-live="polite" aria-atomic="true">${G.over?'BATTLE OVER':mine?'YOUR TURN':'FOE’S TURN'}</strong>${G.pvp?`<span class="turnClock ${G.opp.seconds<=15?'urgent':''}" aria-label="${G.opp.seconds} seconds remaining">${G.opp.seconds}s left</span>`:''}${hh?`<small>Hero hit ${need(un,10)}+</small>`:''}</div>${identity('foe',foeName,G.opp.avatar||'undead',E)}</div>`;
 return `<div class="${mine?'':'foeturn'}" style="display:contents">${tb}<div class="board" role="group" aria-label="Battlefield, 4 columns by 5 rows. Blue solid units are yours; red dashed units belong to your opponent.">${bd}</div><aside class="battleRail" aria-label="Battle status and controls"><small class="battleCounts">Your deck ${P.deck.length} · Foe deck ${E.deck.length} · Foe hand ${E.hand.length}</small>${tutorialObjectiveButton()}<div class="mid"><div class="pr">${pr}</div>${V.saveMsg?`<div role="alert">${V.saveMsg}</div>`:''}</div><div class="bar combatActions">${!G.pvp&&!G.over&&!G.tut?`<button class="btn ${G.auto?'pri':''}" data-a="auto" aria-pressed="${!!G.auto}" aria-label="Auto-play ${G.auto?'on, tap to take over':'off'}">Auto ${G.auto?'on':'off'}</button>`:''}${G.pvp&&!G.over?`<button class="btn" data-a="resign" aria-label="${V.pv&&V.pv.rc?'Tap again to resign':'Resign'}">${V.pv&&V.pv.rc?'Sure?':'Resign'}</button>`:''}<button class="btn pri ${idle?'nudge':''} ${mine?'':'wait'}" data-a="end" ${mine?'':'disabled'}>End turn</button>${!G.pvp?`<button class="btn" data-a="quit">Leave</button>`:''}</div></aside><div class="sw x hw"><small class="handLabel">YOUR HAND · ${P.hand.length} cards · Hold a card to read</small>${SB('x','Scroll hand left')}<div class="hand sc" role="group" aria-label="Your hand">${hd||'<p class="emptyHand">Your hand is empty. Draw a card next turn.</p>'}</div>${SA('x','Scroll hand right')}</div></div>`
 +(G.over?`<div id="ov"><div>${G.res}</div>${!G.pvp&&G.over!='p'?'<button class="btn pri" data-a="retry">Retry battle</button>':''}${!G.pvp&&!G.tut&&G.over=='p'&&G.oi+1<CAMP.length&&G.oi+1<=S.prog?'<button class="btn pri" data-a="nextstory">Next encounter →</button>':''}<button class="btn" data-a="logtoggle" aria-label="Review combat log">Combat log</button><button class="btn" data-a="quit">${!G.pvp&&!G.tut?'Return to Story':'Continue'}</button></div>`:'')
 +(V.intro?matchIntroHTML(V.intro):'')+tutorialObjectiveHTML()+emoteHTML()+combatLogHTML()}
const GUIDE=[
['Hub, Story and landscape',`<p>The <b>Hub</b> links directly to Story, Ranked, Collection, Deck, Store, Packs, Missions, Social, Profile, Lore and this Guide. Story is a chapter book: turn pages to browse encounters, then defeat them in order. Rotate your device horizontally; the board stays 4 columns by 5 rows, with your hand along the bottom and battle controls on the right.</p><p><b>Your units</b> have a blue solid border and a YOU badge. <b>Opponent units</b> have a red dashed border and a FOE badge. These markers follow units wherever they move; the top and bottom deployment rows do not determine ownership. Hold a unit or hand card to inspect its full details.</p><p>After a single-player defeat, <b>Retry battle</b> restarts the same encounter and difficulty without another reward for pressing Retry.</p>`],
['A continuous story',`<p>Each encounter follows a discovery from the previous fight. Read the original introductory dialogue, win to reveal the next clue, then choose <b>Next encounter</b> to continue directly to its briefing. Returning to the book does not lose your place: <b>Continue story</b> opens the next uncleared encounter. The final battle concludes the chronicle. Dialogue is text, not recorded or synthesized speech.</p>`],
['Opening d20 &amp; custom dice',`<p>In Story, Ranked, rated-bot and friendly battles, each player rolls their own d20. Tap <b>Roll d20</b> on the opening screen: the higher roll goes first, and ties reroll automatically until there is a winner. Both online players see the same results, including after reconnecting; a roll cannot be changed by closing the screen or tapping again. The second player keeps the extra opening card, whichever seat wins the roll.</p><p><b>Store → Custom d20s</b> offers permanent cosmetic dice for gold: Emberheart 250, Deep Anvil 400, Gloamwood 550 and Starless Court 800. Guild Ivory is included. Buy or equip a die there, or follow the dice link from Profile. Your equipped die appears in every normal mode and is visible to your online opponent. Dice never change the odds: every face has a 1-in-20 chance. There are no Story dice rewards.</p><p>Rolling has an original tumble animation and synthesized sound effects. Sound mute applies; reduced motion shows the result without tumbling. Online play waits for both players to roll, then starts the normal turn clock; failing to roll within the opening time limit forfeits. Guided lessons and practice keep their fixed first turn and need no opening roll.</p>`],
['Battle emotes',`<p>All six base text emotes are included automatically, with no purchase or unlock step. Tap <b>Emote during combat</b> to express yourself, including on your opponent's turn. The picker shows the full phrase before you send it. Send one every 3 seconds, or mute opponent emotes from the picker. Emotes are not shown on battle results.</p><p><b>Store → Graphic emotes</b> offers optional original pixel-art emotes for 350 gold each, with previews. Paid graphics are not granted for free. All owned emotes are available without equipping and never change rolls or rewards. Story, rated bots, human Ranked and friend matches support emotes. Online messages are fixed choices, not free-form chat, and are stored with match logs.</p>`],
['Review combat',`<p>Tap <b>Log</b> during a battle or <b>Combat log</b> on the result screen. Events run oldest to newest, grouped by turn and labelled You or Foe. Review attack and Save rolls with required thresholds, actual damage, healing, summons, spells and movement. Filter to Rolls, HP changes or Actions.</p><p>Scroll upward to review older events without being pulled back down by new actions. <b>Follow latest</b> resumes live following. Reviewing does not pause the battle or online timer. History is kept for the current battle only, up to 2,000 events; any trimming is disclosed. Close or press Escape to return without taking an action.</p>`],
['The goal',`<p>Each duel is a fight between you and a foe. Every hero has Health. <b>Reduce the enemy hero to 0 Health to win.</b> If your own hero reaches 0 you are defeated, but you still earn a little gold and can try again.</p><p>Your hero starts with 20 Health. Foes have more as the campaign goes on.</p>`],
['A turn, step by step',`<ol><li><b>Start of turn:</b> your Mana refills (and its maximum rises by 1, up to 10), you draw a card, and your creatures wake up with full Initiative and the ability to attack.</li><li><b>Play cards</b> from your hand by spending Mana. Tap a card, then tap where it should go or what it should target.</li><li><b>Move and attack</b> with your creatures. Tap a creature with a green outline, then a yellow tile to move or a red target to attack.</li><li><b>End turn.</b> The foe takes its turn, then it is yours again.</li></ol><p>The big banner at the top always says whose turn it is. When it is not yours, your hand fades and taps do nothing.</p>`],
['Reading a card',`<p>Hover a card with a mouse, hold it on touch (or right-click on a computer) to open the full-size reading box. Tap the reading box or press Escape to close it. Scroll it to read long ability explanations. This works in your hand, on the battlefield, in Collection, Deck and pack results.</p><ul><li><b>Number in the corner:</b> Mana cost.</li><li>The six creature stats always follow the same order: <b>ATK, HP, GRD, AIM, MOVE, SAVE</b>. Higher Attack and Health are better; lower Guard, Aim and Save are better. MOVE is Initiative, the number of tiles available each turn.</li><li>In battle, HP and MOVE show current / maximum. Gold numbers with an <b>*</b> mark stats changed from the printed card by effects or equipment.</li><li>The coloured identity band names the <b>class and creature type</b>. It is separate from the labelled <b>rarity badge and border</b>. Gear shows its slot.</li><li>Ability tags use the same names, symbols and order in every full-card view; Reach is always shown. Inspect a card to read each ability's rules.</li></ul>`],
['Mana (✦)',`<p>Cards cost Mana (the number in the corner). You begin the duel with 0 maximum Mana and gain 1 each turn, so turn 3 gives 3 Mana. It all refills every turn and unspent Mana is lost. A card with a red cost is too expensive right now.</p>`],
['The 4×5 grid',`<p>The battlefield is a grid 4 tiles wide and 5 tiles tall. The <b>top row is the foe's back row</b> and the <b>bottom row is yours</b>. The three rows between are no-man's-land. Your creatures always start on your bottom row.</p><p>Only one creature fits on a tile. Creatures never leave the grid on their own: they stay until they fall or the duel ends.</p>`],
['Summoning creatures',`<p>Play a creature card, then tap a glowing tile on your bottom row. A newly summoned creature is <b>tired</b>: it cannot move or attack until your next turn.</p>`],
['Initiative (movement)',`<p>Initiative is how many tiles a creature can move each turn, one step at a time up, down, left or right (no diagonals). The tile shows <b>Init 1/2</b>: 1 left out of 2. You may split your movement, and move before or after attacking.</p>`],
['Reach and attacking',`<p><b>Reach</b> is how many tiles away a creature can strike (counted the same way as movement, with no diagonals). Most creatures have Reach 1, so they must be next to their target. Reach-2 creatures (archers, pikemen, spear-users) can hit from two tiles away.</p><ul><li>Each creature attacks <b>once per turn</b>.</li><li>To hit the <b>enemy hero</b>, get to the foe's side of the grid: a creature with Reach 1 must stand on the top row, with Reach 2 it can attack from the second row from the top. Then tap the foe's hero bar.</li><li><b>Retaliation:</b> after you attack a creature, it strikes back <em>only if you are within its own Reach</em> and it survived. A Reach-2 archer shooting a Reach-1 fighter from two tiles away takes no counterattack. Heroes never retaliate.</li></ul>`],
['Hitting: Aim and Guard',`<p>Combat uses a d20 roll against two numbers.</p><ul><li><b>Aim</b> is the d20 roll an attacker needs to hit a target with Guard 0. A lower Aim is better.</li><li><b>Guard</b> is how hard a target is to hit. A <em>lower</em> Guard is better, and Guard can go below 0. Heroes have Guard 10.</li></ul><p><b>To hit, roll a d20 and get at least Aim − target's Guard.</b> The 🎯 tags in battle show the exact number needed.</p><p><i>Example:</i> a Squire (Aim 20) attacks a Skeleton (Guard 7). Needed: 20 − 7 = 13, so the Squire hits on a 13 or higher (40% of the time). Against a Knight with Guard −2 the roll would be 22, which is capped at 20.</p><ul><li><b>Natural 20</b> always hits and does <b>double damage</b>.</li><li><b>Natural 1</b> always misses.</li><li>The needed number is never below 2 or above 20.</li></ul><p>Damage is the attacker's ⚔ Attack value. A creature at 0 ♥ is removed from the grid.</p>`],
['Profile, cosmetics & rank',`<p>Choose your profile picture and battlefield background on the Profile tab. Extra pictures and backgrounds are bought with gold in the Store. Ranked players earn a rank badge from Bronze to Mythic, shown on the Ranked page, on your Profile and in battle. Each fight opens with a scene showing both players, their ranks and their records; tap Begin battle to start.</p>`],
['Card finishes & Arcane Dust',`<p>Open <b>Copies &amp; cosmetics</b> in Collection, Deck or pack results, or choose <b>Copies &amp; cosmetics</b> beside a card in your deck list. Pick one individual copy to preview and combine frame colours, title lettering, holographic backgrounds and foil shine. Basic silver/red/blue frame or lettering costs 25 Dust each; gold costs 75; foil 300; holographic 600; gold holographic 1,200. Confirm purchases to unlock permanently on that copy; switching unlocked treatments is free. Choose which deck copy to replace and save your build.</p><p>Plain spare breakdown pays the normal gold reward <b>plus ${CF.DUST.join(' / ')} Arcane Dust</b> by rarity. Keep at least three total copies per card name. Purchased-cosmetic copies are permanently protected. Pack-only cosmetic spares require separate confirmation and give normal rewards plus 6% of their granted treatment's price, rounded down, even with its appearance switched off. Bulk breakdown never includes cosmetics.</p><p>After finishing or skipping a pack opening, the summary shows all cards obtained and offers <b>Review &amp; break down extras</b> with a separate confirmation. It considers plain spares from <b>every pack in that opening</b>, including mixed-tier Open all, never older collection copies. Closing the summary keeps remaining cards and returns to a clean Packs menu. Cosmetic drop chances per card are 0.25% / 0.75% / 1.5% for Standard / Veteran / Legendary packs. Basic foil is possible even in Standard packs. Holographic drops require Rare or Legendary cards; gold holographic requires Legendary. Pull rates shows exact treatment odds. Pack reveals celebrate both card rarity and cosmetic discoveries; Open all is always available.</p><p>Finishes appear in all normal battle modes and menus, never change rules, and never replace ownership, readiness, targeting, blocked/playable, class or rarity colours. Tutorial lessons and guided practice stay plain. Reduced-motion settings disable animated effects.</p>`],
['Profile & cloud save',`<p>On Android, sign in with Google from the Profile tab to sync progress between devices. If devices changed the save separately, choose which copy to keep. Signing out keeps your local save.</p>`],
['Saving throws',`<p>Many spells let the target make a <b>Save</b>. Roll a d20: if you roll the target's Save number or higher, it resists. A <b>lower Save is better</b>. Damage spells deal half damage (rounded down) on a save, and Sleep and Hold Person do nothing. Heroes get no save, so damage spells always hit them fully.</p>`],
['Warded protection',`<p><b>Warded</b> reduces damage from spells by 1 <b>after</b> any Save, to a minimum of 1. A spell already reduced to 0 still deals 0. It does not prevent Sleep, Poison, combat or retaliation damage.</p><p>Lanternbound Adept has Warded naturally; Deep Anvil Charm grants it to its wearer. The Charm uses your creature's single magic-item slot, and granting Warded twice does not stack.</p>`],
['Creature abilities',`<p>Abilities appear on creature cards and are defined in the glossary:</p><ul><li><b>Haste:</b> acts the turn it is summoned.</li><li><b>Two attacks:</b> attacks twice per turn (each target may retaliate).</li><li><b>Poison:</b> a creature it hits must make a Save or take 2 more damage.</li><li><b>Paralysis:</b> a creature it hits must make a Save or lose its next turn.</li><li><b>Drain:</b> a creature it hits permanently loses 1 Attack.</li><li><b>Backstab:</b> adds one Attack value of damage against an unhurt creature, including on critical hits.</li><li><b>Magic resistance:</b> half of hostile damage and control spells fizzle; Turn Undead bypasses it.</li><li><b>Undead and Constructs</b> are immune to Sleep, Hold, Poison and Paralysis.</li><li><b>Tough:</b> reduces damage from attacks and retaliation by 1, never below 1. It does not reduce spells or Poison.</li><li><b>Thorns:</b> an attacker that hits it takes 1 damage, including ranged attackers.</li><li><b>Warded:</b> reduces spell damage by 1 after Saves, never below 1. It does not stack.</li><li><b>Lifelink:</b> heals your hero for 1 each time it hits.</li><li><b>Keen, Heal, Regenerate</b> as in the glossary.</li></ul>`],
['Spells, potions and magic items',`<p>Spells and potions are used once and then go away. Some need a target (tap the glowing one) and some (like Meteor Swarm) simply go off when you play them. Damage spells ignore Guard: they never miss.</p><p><b>Area spells</b> hit several foes. 🔥 <b>Burning Hands</b>: the target and every creature touching it. 💥 <b>Fireball</b>: the target and everything within 1 tile, diagonals too. ⚡ <b>Lightning Bolt</b>: the target's whole column. ❄️ <b>Cone of Cold</b>: its whole row. ⛓️ <b>Chain Lightning</b>: leaps to the nearest foe, losing 2 damage each jump. Splash and chain damage is lower than the main hit, and each foe gets its own save.</p><p><b>Sound:</b> 🔊 turns all sound on or off and 🎵 turns just the music off. Four original battle tracks shuffle without immediate repeats. Music is generated in the app, so there is nothing to download.</p>`],
['Weapons, armour and gear',`<p>Gear cards are played on one of <b>your creatures</b> and stay for the rest of the duel. Each creature may carry <b>one weapon, one armour and one magic item</b>. Gear can grant abilities such as Tough, Thorns, Lifelink or Poison on top of the creature's own. A creature that falls takes its gear with it. If a creature already has that kind of gear you cannot add another.</p><p>Gear boosts a stat: more Attack, lower Aim, lower Guard, extra Health, Initiative, Reach or Save.</p>`],
['Collection &amp; Deck tabs',`<p><b>Collection</b> lists every card you own. Hover over any card (press and hold on a touchscreen) to read it in full: class, creature type, stats and abilities. Tools and spare-card breakdown are on the left; cards scroll independently beside them.</p><p><b>Deck</b> is the builder. The counter shows how full your deck is and turns green at 20 cards. Hover over a card (or press and hold) to read it, then tap it or use its − / + buttons to change quantities. The list on the right groups your deck by type and lets you choose each slot's exact copy and appearance. <b>Saved builds</b> retain these copy selections.</p><p><b>Filters:</b> search by name or ability, then open Filters. In each group you can pick several chips at once: a card must match at least one chip in every group you use. Tap a chip again, or its ✕ under the search bar, to remove it.</p><p><b>Plain spare breakdown:</b> keep at least 3 copies per card name. Eligible plain extras give both gold (${DelversCards.SELL.join(' / ')}) and Arcane Dust (${CF.DUST.join(' / ')}) by rarity. Purchased cosmetics are protected; pack cosmetics are excluded from bulk breakdown and require separate confirmation in Copies &amp; cosmetics.</p>`],
['Tutorial, starter decks &amp; missions',`<p>The <b>Learn to Play</b> button on the Hub and replay button here offer eight hands-on lessons: mana and summoning, readiness, movement, Aim/Guard combat and Saves, targeted spells, equipment, Haste, and attacking the hero. Perform each action to unlock Next, then try a full practice fight. Lessons and practice do not spend your campaign progress or pay repeat gold or mission rewards. You may skip or replay them.</p><p>Win practice to earn <b>one free Standard pack</b> and pick one free <b>starter deck</b>: Ironwall Vanguard (tough fighters), Emberlight Mages (spells) or Shadow Hunt (fast strikers). Then continue the tutorial through <b>pack opening, currencies and deck building</b>. Open all during the reveal shows every obtained card; optional extra-copy breakdown always needs confirmation. Learn gold and Arcane Dust, then change a quantity in the real Deck UI and finish with 20–30 cards. You can restore the original quantity; spending and breakdown are not required.</p><p>Completed existing players receive their missing free pack without another starter. Rewards are once only, including on replay. After the free pack has been opened, replaying the tutorial uses a clearly labelled <b>practice pack</b>: its example cards are not rewards and are not added to your collection. The Hub resumes unfinished menu lessons in a dedicated tutorial screen; normal Packs and Deck screens remain available without tutorial guidance. Closing during opening resumes the card summary. Eligible existing accounts retain their free starter pick. The same decks are in the <b>Store</b> for 🪙400 each.</p><p><b>Missions</b> have daily and weekly goals that pay gold and packs. Claim rewards yourself; they reset by your device clock.</p>`],
['Ranked players and rated bots',`<p>Ranked uses the normal deck rules: 20–30 cards and up to 3 copies of any card, regardless of rarity. Compatible human players have priority. After <b>20 seconds</b> without a match, a clearly labelled <b>BOT</b> joins automatically. Its themed deck and strategy reflect your displayed rank; unranked players start against Bronze bots.</p><p>Bot matches are <b>rated</b>: wins, losses and resigning count, and a loss is reserved when a ranked match begins so leaving cannot avoid it. Bots are synthetic opponents, not fake player accounts; they do not appear on the leaderboard. Human ranked matches work the same way as before. Friend invitations stay unranked and never fall back to bots.</p>`],
['Building your deck',`<ul><li>Build your deck in the <b>Deck</b> tab. A deck holds <b>up to 30 cards</b>. You need <b>at least 20</b> to fight.</li><li>You may include up to <b>3 copies</b> of a card, if you own that many.</li><li>You draw 3 cards at the start (and the foe 4) and 1 more each turn. Your hand holds <b>7</b>; extra draws are lost.</li><li>If you try to draw from an empty deck you take <b>2 damage</b> instead (fatigue).</li><li>"Auto" builds a balanced deck for you: mostly cheap creatures, then spells and gear.</li></ul>`],
['Campaign, rewards and packs',`<p>Story has 60 encounters across 9 chapters: 40 <b>skirmishes</b> and 20 <b>bosses</b>. Beat each in order to unlock the next. First clears pay at least 🪙30 at ★; early successful battles fund roughly one 🪙100 pack per three wins, with faster rewards later. Replays pay 15% of base gold (at least 🪙3), and losses pay 5% (at least 🪙2), before difficulty bonuses and rounding.</p><p><b>Star tiers:</b> beat ★ to unlock ★★, then beat ★★ to unlock ★★★. Foes get more health, smarter AI and rarer cards. Rewards multiply by <b>1 / 1.35 / 1.75</b> at ★ / ★★ / ★★★. Each boss's first clear on each tier gives a Standard / Veteran / Legendary pack respectively. ★★★ guarantees a Rare or better in the final slot.</p><p><b>Pull rates:</b> Packs → Pull rates shows exact odds for every pack type. In the Store, packs cost 🪙100 each and contain 5 cards with at least 1 Uncommon or better. Expected spare-card sell-back value is below the pack price, but a lucky pack may sell for more. Your collection, gold, decks and campaign progress save automatically on this device.</p>`],
['Tips for new Delvers',`<ul><li>Keep a spread of cheap creatures so you can play something every turn.</li><li>Use Reach-2 creatures behind a front line: they hit without being hit back.</li><li>Check the 🎯 number before attacking: a 15+ is risky. Put armour on your best creatures.</li><li>Heal your hero or kill their damage dealers before the foe reaches your side of the grid.</li><li>Sleep and Hold Person on the biggest attacker buy you several turns.</li><li>Stuck on a boss? Buy packs, use Auto build in the Deck tab, sell spare cards from the Collection tab or replay earlier fights for gold.</li></ul>`],
['Credits & licences',`<p>This game includes adapted material from the <a href="https://dnd.wizards.com/resources/systems-reference-document" target="_blank" rel="noopener">System Reference Document 5.1 (SRD 5.1)</a> by Wizards of the Coast LLC. SRD 5.1 is licensed under the <a href="https://creativecommons.org/licenses/by/4.0/legalcode" target="_blank" rel="noopener">Creative Commons Attribution 4.0 International License</a>. Delvers has adapted selected names and concepts for an original card game; the rules, card text and setting have been changed or created for Delvers. This game is not affiliated with or endorsed by Wizards of the Coast.</p>`]];
const GLOSS=[['Guard','How hard a target is to hit. Lower is better; heroes have Guard 10.'],['Alignment','A flavour label such as LG (Lawful Good) or CE (Chaotic Evil). It has no effect on gameplay.'],['Armour','Gear that lowers Guard and often adds Health. One per creature.'],['Attack (⚔)','The damage a creature deals when it hits.'],['Back row','The row of tiles closest to a hero. You summon creatures on yours.'],['Backstab (keyword)','Adds one Attack value of damage against an unhurt creature, including on critical hits.'],['Boss','A named foe at the end of each group of skirmishes. Gives a free pack the first time you win.'],['Cloud save','Your progress stored under your Google account (Android app, once set up). Syncs automatically.'],['Class / type','What a creature is: Fighter, Wizard, Cleric, Thief, Ranger, Beast, Undead, Giant, Dragon, Elemental or Construct. Foes favour certain types.'],['Cost','The Mana you must spend to play a card (number in the corner).'],['Starter deck','A ready-made 30-card deck. Earn one from the tutorial or buy them in the Store.'],['Mission','A daily or weekly goal, such as winning battles. Completing it lets you claim gold or packs.'],['Collection','Every card you own. Browse and sell spares in the Collection tab; build your deck in the Deck tab.'],['Filter','Narrows the card list. Pick several chips in one group to match any of them; every group you use must match.'],['Preview','Hover a card (or press and hold on touch) to open the full-size reading box. Tap the box or press Escape to close it.'],['Build','A saved, named deck you can load later from the Deck tab.'],['Critical hit','A natural 20: always hits and deals double damage.'],['d20','A twenty-sided die. The game rolls it for you.'],['Drain (keyword)','A creature it hits permanently loses 1 Attack.'],['Fatigue','Drawing from an empty deck: you take 2 damage instead.'],['Gear','Weapon, armour and magic item cards that permanently boost a creature.'],['Lifelink (keyword)','Heals your hero for 1 each time the creature hits.'],['Thorns (keyword)','An attacker that hits this creature takes 1 damage, including ranged attackers.'],['Tough (keyword)','Reduces damage from attacks and retaliation by 1, never below 1. Does not reduce spells or Poison.'],['Haste (keyword)','The creature may move and attack on the turn it is summoned.'],['Health (♥)','How much damage a creature or hero can take before falling.'],['Heal (keyword)','Heals your hero for 1 at the start of each of your turns.'],['Initiative','Movement. The number of tiles a creature can move each turn.'],['Keen aim (keyword)','The attacker needs 1 less on the d20 to hit.'],['Magic item','A potion, wand or enchanted item. Gear versions stay on a creature; potions and wands are used once.'],['Mana (✦)','The resource you spend to play cards. Refills each turn and the maximum grows to 10.'],['Magic resistance (keyword)','Half of hostile damage and control spells fizzle. Turn Undead bypasses magic resistance.'],['Natural 1 / 20','The raw d20 result before any modifiers. A natural 1 always misses; a natural 20 always hits.'],['Immunity','Undead and Constructs ignore Sleep, Hold, Poison and Paralysis.'],['Paralysis (keyword)','A creature it hits must make a Save or skip its next turn.'],['Poison (keyword)','A creature it hits must make a Save or take 2 more damage.'],['Spare card',`A copy beyond the 3 you keep. Sells for gold: Common ${DelversCards.SELL[0]}, Uncommon ${DelversCards.SELL[1]}, Rare ${DelversCards.SELL[2]}, Legendary ${DelversCards.SELL[3]}.`],['Pack','5 random cards. Bought in the Store, opened in the Packs tab.'],['Rarity','Common (grey), Uncommon (green), Rare (blue) or Legendary (gold), shown by its own labelled badge and border, separate from class colour.'],['Two attacks (keyword)','The creature may attack twice each turn.'],['Reach','How many tiles away a creature can attack. Default 1.'],['Regenerate (keyword)','The creature heals 2 Health at the start of each of your turns.'],['Retaliation','A creature hit in combat strikes back, but only if the attacker is within its own Reach.'],['Save','A d20 roll to resist a spell. Roll the number or higher to succeed; lower is better.'],['Skirmish','An ordinary campaign fight, easier than the boss that follows.'],['Sleep / Hold','A sleeping creature cannot move or attack for its next turn(s). Saves negate it.'],['Slot','Each creature can carry one weapon, one armour and one magic item.'],['Summoning','Playing a creature onto your back row. It cannot act until your next turn.'],['Aim','The d20 roll needed to hit a target with Guard 0. Lower is better. Roll at least Aim − target Guard to hit.'],['Weapon','Gear that adds Attack and/or improves Aim. One per creature.']];
function guideHTML(){return `<small>New here? Tap a section to read it.</small><div class="bar" style="margin:6px 0"><button class="btn" data-a="tutstart">▶ Replay the tutorial</button></div><details class="rules glossary"><summary>Glossary of game terms</summary>${[...GLOSS,['Warded (keyword)','Damage from a spell is reduced by 1, after any Save, to a minimum of 1. Zero damage stays zero. Warded does not block Sleep, Poison, combat or retaliation damage. Lanternbound Adept has it naturally; Deep Anvil Charm grants it using the creature’s magic-item slot.']].sort((x,y)=>x[0].localeCompare(y[0])).map(t=>`<p><b>${t[0]}</b>: ${t[1]}</p>`).join('')}</details>`+GUIDE.map((g,i)=>`<details class="rules" ${i==0?'open':''}><summary>${g[0]}</summary>${g[1]}</details>`).join('')}
const WORLD=[['The Ember Throne','For ten thousand years the God-King Aurelian the Undying has sat the Ember Throne in the cathedral-fortress of Hallowspire. He is sustained by the Emberheart, a vast engine of light built by the First Dwarves. Its radiance holds back the Hollow.'],
['The Long Dusk','The Emberheart is failing. At the edge of its light the Hollow Seal has cracked, and the Hollow, a plane of hunger and shadow, seeps into Vaelmark. The dead walk, the Ironmaw host marches, dragons wake. In the grim dark of the Long Dusk, there is only war. Below it all lie the Hollow Reaches, and a throne without stars.'],
['The Delvers','The Delvers’ Guild licenses mercenaries, heretics and fools to descend into the Underhalls, the ruined cities, tombs and vaults beneath Vaelmark, and recover Embershards to feed the Emberheart. A Delver fights with steel, spells and the old rule of the d20.'],
['The Powers','The Emberguard (the Throne’s armoured knights), the Ironmaw Clans (Tuskborn bound by a hunger-oath), the Cogwright Conclave (magic fused with machine), the Cinder Brood (dragons), the Pale Court (the undead), the Spiderthrone (dark elves), the Cairn-Kings (giants) and the Rustfang goblins all want the Emberheart: to keep it, to feed on it, or to put it out.']];
function loreHTML(){return WORLD.map(w=>`<div class="op" style="display:block"><b>${w[0]}</b><br><small>${w[1]}</small></div>`).join('')+'<h3>Dossiers</h3>'+OP.map((o,i)=>{const k=i*3+2,seen=S.prog>=k;return `<div class="op ${seen?'':'dim'}" style="display:block"><b>${seen?'👑 '+o[0]:'??? (Boss '+(i+1)+')'}</b><br><small>${seen?o[7]+' · '+o[8]+'<br>'+o[9]+'<br><i>Defeated:</i> '+o[10]:'Reach this boss to learn their story.'}</small></div>`}).join('')}
const STP='M12 1.8l3.2 6.6 7.2 1-5.3 5 1.4 7.2L12 18.2l-6.5 3.4 1.4-7.2-5.3-5 7.2-1z';
const SVGS=(n,tot,sz)=>{tot=tot||n;sz=sz||16;let h='';for(let k=1;k<=tot;k++){const on=k<=n;h+=`<svg class="sta ${on?'on':''}" width="${sz}" height="${sz}" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="sg${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${k==3?'#fff1a8':k==2?'#ffe27a':'#f6cf5a'}"/><stop offset="1" stop-color="${k==3?'#e0861a':k==2?'#d99a1c':'#c28a1e'}"/></linearGradient></defs><path d="${STP}" fill="${on?`url(#sg${k})`:'#3a3340'}" stroke="${on?'#fff6c9':'#5b5366'}" stroke-width="1" stroke-linejoin="round"/>${on&&k==3?'<circle cx="12" cy="11" r="2.2" fill="#fff" opacity=".7"/>':''}</svg>`}return `<span class="stars" role="img" aria-label="${n} of ${tot} stars">${h}</span>`};
const tierHTML=i=>{const m=star(i);if(m<1)return'';const t=V.tier||1,h=[1,2,3].map(k=>`<button class="chip ${t==k?'on':''}" data-a="tier" data-i="${k}" aria-pressed="${t===k}" ${k>m+1?'disabled':''} aria-label="Difficulty ${k} star${k>1?'s':''}${k>m+1?' (locked)':k<=m?' (cleared)':' (next challenge)'}">${SVGS(k,k,18)}${k>m+1?' 🔒':''}</button>`).join('');
 return `<p>${SVGS(m,3)} ${m} / 3 stars earned.</p><div class="chips" style="margin-top:6px">${h}</div><small>${t==1?'Normal.':t==2?'Two stars: foe has +20% health, a smarter AI and rarer cards. Pays ×1.35.':'Three stars: +40% health, the strongest AI and cards. Pays ×1.75.'}${m<3?' Win each tier to unlock the next.':''}</small>`};
function briefHTML(){const o=CAMP[V.brief],s=STORY[V.brief];return `<section class="storyBriefLayout"><div class="op storyBrief"><small>${o[8]} · Encounter ${V.brief+1} / ${CAMP.length}</small><h3>${o[12]?'👑 ':''}${o[0]}</h3><small><b>${o[7]}</b> · ❤ ${o[1]} · 🪙 ${rew(o,V.brief,V.tier||1)}${firstClear(V.brief,V.tier||1)?' (first clear)':' (replay)'}<br>Fields: ${o[6].map(c=>CL[c][0]).join(' / ')}</small><p>${o[9]}</p><blockquote><b>${s.speaker}</b><br>${s.line}</blockquote></div><div class="briefControls">${tierHTML(V.brief)}<div class="bar"><button class="btn pri" data-a="begin">Begin encounter</button><button class="btn" data-a="back">Back to Story</button></div></div></section>`}
const SELL=DelversCards.SELL,KEEP=3,xtra=c=>Math.min(Math.max(0,own(c.name)-KEEP),S.copies[c.name].filter(c=>!CF.cosmeticCopy(c)&&!CF.protectedCopy(c)).length),xtraAll=()=>{const q=CF.quote(S,CF.extras(S));return[q.cards.length,q.gold,q.dust]};
const costBand=n=>n<=1?'0':n<=3?'1':n<=5?'2':'3';
function copyLabel(c){if(!c)return'Plain';const look=CF.cleanLook(c.look),text=Object.entries(look).map(([slot,id])=>CF.option(slot,id).name+' '+slot).join(', ');return text||'Default appearance'}
function copyManagerHTML(){
 if(G||!V.copyName)return'';
 const list=S.copies[V.copyName]||[],c=list.find(c=>c.id===V.copyId);
 if(!c)return'';
 const preview={...CF.styled(S,V.copyName,c.id),look:V.lookDraft||c.look},purchase=V.lookPurchase;
 const slots=[['Frame',['frame']],['Lettering',['lettering']],['Finishes',['background','foil']]].map(([label,group])=>`<fieldset><legend>${label}</legend>${group.map(slot=>`<div class="cosmeticChoices" role="group" aria-label="${slot==='background'?'Holographic background':slot==='foil'?'Foil shine':label}"><button class="btn" data-a="lookdefault" data-slot="${slot}" aria-pressed="${!preview.look[slot]}">${slot==='background'?'No holographic':slot==='foil'?'No foil':'Default'}</button>${CF.CATALOG[slot].map(x=>{
  const owned=c.unlocked[slot].includes(x.id);
  return `<button class="btn" data-a="lookpreview" data-slot="${slot}" data-k="${x.id}" aria-pressed="${preview.look[slot]===x.id}">${x.name}<small>${owned?'Unlocked · use free':'Preview · '+x.cost+' Dust'}</small></button>`;
 }).join('')}</div>`).join('')}${label==='Finishes'?'<small>Holographic backgrounds and foil shine can be worn together.</small>':''}</fieldset>`).join('');
 const positions=S.deck.map((name,i)=>name===V.copyName?i:-1).filter(i=>i>=0);
 const deckSlots=positions.length?`<section class="copyDeck"><b>In your deck</b><small>Choose which deck copy to replace with the selected collection copy.</small><div class="copyDeckChoices">${positions.map((i,n)=>{const selected=CF.find(S,S.deckCopies[i])?.copy;return `<button class="btn" data-a="copydeck" data-i="${i}" data-copy="${c.id}" aria-pressed="${S.deckCopies[i]===c.id}">Deck copy ${n+1}${S.deckCopies[i]===c.id?' · selected':''}<small>${esc(copyLabel(selected))}</small></button>`}).join('')}</div></section>`:'';
 const salvage=CF.extras(S,[c.id],true).length>0;
 return `<div class="copyShade"><section id="copyManager" role="dialog" aria-modal="true" aria-labelledby="copyTitle"><header><h2 id="copyTitle">${V.copyName} · Copies &amp; cosmetics</h2><button class="btn" data-a="copyclose">Close</button></header><div class="copyBody"><aside class="copyPreview">${card(preview,'','zoom')}<small>${esc(copyLabel({...c,look:preview.look}))}</small></aside><div class="copyControls sc v"><label for="copySelect">Individual copy</label><select id="copySelect" data-f="copyId">${list.map((x,i)=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>Copy ${i+1} (${x.id}) · ${copyLabel(x)}${S.deckCopies.includes(x.id)?' · In deck':''}${CF.protectedCopy(x)?' · Protected':CF.cosmeticCopy(x)?' · Pack cosmetic':''}</option>`).join('')}</select>${deckSlots}<p><b>${S.dust} Arcane Dust</b> · Treatments unlock only on this copy. Previewing is free.</p>${V.copyMessage?`<p role="status">${esc(V.copyMessage)}</p>`:''}${V.saveMsg?`<p role="alert">${esc(V.saveMsg)}</p>`:''}${purchase?`<div class="cosmeticConfirm" role="group" aria-label="Confirm cosmetic purchase"><b>Unlock ${CF.option(purchase.slot,purchase.id).name} ${purchase.slot} for ${CF.option(purchase.slot,purchase.id).cost} Arcane Dust?</b><p>This copy will permanently become protected from breakdown.</p><button class="btn pri" data-a="lookbuy" ${S.dust<CF.option(purchase.slot,purchase.id).cost?'disabled':''}>Confirm purchase</button><button class="btn" data-a="lookcancel">Cancel preview</button></div>`:''}${slots}<p>${CF.protectedCopy(c)?'Protected: this copy has a purchased cosmetic and cannot be broken down.':CF.cosmeticCopy(c)?'Pack cosmetic: excluded from bulk breakdown. Only spares beyond three may be salvaged separately, with a 6% treatment bonus rounded down.':'Plain copy: eligible for spare breakdown only when more than three are owned.'}</p>${salvage?'<button class="btn" data-a="salvageask">Break down this pack cosmetic spare</button>':''}${V.salvageQuote?breakdownConfirmHTML(V.salvageQuote,'salvageconfirm','salvagecancel'):''}</div></div></section></div>`;
}
function breakdownConfirmHTML(q,confirm,cancel){
 return `<div class="cosmeticConfirm" role="group" aria-label="Confirm card breakdown"><b>Destroy these ${q.cards.length} copies permanently?</b><ul>${q.cards.map(c=>`<li>${esc(c.name)} · ${c.id}${c.bonus?' · +'+c.bonus+' cosmetic bonus Dust':''}</li>`).join('')}</ul><p>Receive 🪙${q.gold} + ${q.dust} Arcane Dust. At least three copies per card name remain. Cosmetic unlocks on destroyed copies are lost.</p><button class="btn pri" data-a="${confirm}">Confirm breakdown</button><button class="btn" data-a="${cancel}">Cancel</button></div>`;
}
function packReviewIds(){return V.packReviewTutorial?S.tutorialMenus.cards.map(c=>c.copyId):V.rev.map(c=>c.copyId).filter(id=>id&&CF.find(S,id))}
function packExtrasHTML(){
 const ids=packReviewIds(),eligible=CF.extras(S,ids),q=CF.quote(S,eligible);
 const cosmetics=ids.filter(id=>{const f=CF.find(S,id);return f&&CF.cosmeticCopy(f.copy)});
 return `<section class="packExtras"><h3>${V.packReviewTutorial?'Tutorial pack extras':'Opening extras'}</h3><small>${V.packReviewTutorial?'Only plain spare copies from this tutorial pack.':'Plain spare copies from every pack in this opening, including Open all.'} Keep at least three per card name; cosmetic copies are never included.</small>${V.packMessage?`<p role="status">${esc(V.packMessage)}</p>`:''}${eligible.length?'<p>Review spare cards for gold and Arcane Dust. Nothing is destroyed until you confirm.</p>':'<p>No eligible plain extras remain. All remaining copies are kept.</p>'}<button class="btn pri" data-a="packextrasask" ${eligible.length?'':'disabled'}>Review &amp; break down extras (${q.cards.length}) · 🪙${q.gold} + ${q.dust} Dust</button>${V.packQuote?breakdownConfirmHTML(V.packQuote,'packextrasconfirm','packextrascancel'):''}${cosmetics.map(id=>{const {name,copy}=CF.find(S,id);return `<button class="btn" data-a="copies" data-k="${name}" data-copy="${id}">${name} · ${copyLabel(copy)} · Review copy</button>`}).join('')}</section>`;
}
function packReviewHTML(){
