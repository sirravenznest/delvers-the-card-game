<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Delvers: The Card Game</title>
<style>
:root{--bg:#16120e;--fg:#f1e8d6;--pan:#2b2218;--ln:#6a5638;--acc:#e0884a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px Georgia,'Times New Roman',serif;-webkit-tap-highlight-color:transparent}
#app{height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:8px;max-width:520px;margin:0 auto}
button{font:inherit;color:var(--fg)}
.hero,.btn,.nav button{border:2px solid var(--ln);border-radius:10px;background:#2b2218f2}
.hero{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;padding:7px 10px;font-weight:bold}
.hero span{font-weight:normal;font-size:12px}
.btn{padding:8px 12px}.btn:disabled{opacity:.4}
.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.nav{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.nav button{flex:1 1 20%;padding:7px 1px;font-size:12px}.nav .on{background:var(--acc);color:#fff;border-color:var(--acc)}.nav span{font-weight:bold;white-space:nowrap;padding-left:4px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.tile{position:relative;height:76px;padding:2px;border:2px solid var(--ln);border-radius:8px;background:#2b2218cc;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;font-size:11px;line-height:1.2;overflow:hidden;transition:opacity .2s,transform .15s}
.tile b{font-size:11.5px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile.u{border-color:var(--k);border-width:3px}.tile.p{background:#2f6b3acc}.tile.e{background:#7a2a1fcc}
.tile .tart{width:48px;height:24px;border-radius:5px;display:block;flex:0 0 auto}
.tile.mv{border:2px dashed #ffd23f;background:#ffd23f33;justify-content:center;color:#ffd23f;font-weight:bold;animation:p2 1.2s infinite}@keyframes p2{50%{background:#ffd23f1a}}
.tile .hit{position:absolute;right:2px;top:2px;background:#d03a3a;color:#fff;border-radius:6px;padding:0 4px;font-size:11px;font-weight:bold}
.tile.done{opacity:.55;filter:saturate(.5)}
.card{position:relative;display:flex;flex-direction:column;gap:1px;width:100%;height:172px;padding:4px 3px 3px;border:2px solid var(--k);border-top-width:6px;border-radius:8px;background:var(--pan);text-align:center;overflow:hidden;transition:opacity .2s,transform .15s}
.card b{font-size:11px;line-height:1.1;margin:1px 8px 0 14px;min-height:24px;display:flex;align-items:center;justify-content:center}
.card .art{width:100%;height:50px;border-radius:5px;display:block}
.card em{font-size:9.5px;line-height:1.15;flex:1;opacity:.9}
.card small{font-size:9.5px;opacity:.9;line-height:1.2}
.card s{position:absolute;right:2px;bottom:1px;font-size:11px;font-weight:bold;text-decoration:none;color:var(--acc)}
.rar{position:absolute;right:2px;top:-5px;width:8px;height:8px;border-radius:50%}
.cost{position:absolute;top:-1px;left:-1px;min-width:19px;height:19px;border-radius:0 0 8px 0;background:var(--k);color:#fff;font-size:12px;font-weight:bold;line-height:19px;z-index:1}
.st{display:flex;justify-content:space-around;font-weight:bold;font-size:13px}.st u{text-decoration:none}
.hand{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 4px;flex:0 0 auto}.hand .card{flex:0 0 94px;width:94px}
.dim{opacity:.4;filter:grayscale(.8)}.ready{box-shadow:0 0 0 3px #5fe07a,0 0 10px #5fe07a}.sel{transform:translateY(-6px);box-shadow:0 0 0 3px #fff,0 0 14px var(--acc)}
.can{box-shadow:0 0 0 2px #5fe07a,0 0 10px #5fe07a99;transform:translateY(-3px)}
.cost.no{background:#c0392b}
.tgt{box-shadow:0 0 0 3px #ff5a4a;animation:p 1s infinite}@keyframes p{50%{box-shadow:0 0 0 6px #ff5a4a55}}
.turn{text-align:center;font-weight:bold;letter-spacing:1px;padding:6px;border-radius:10px;font-size:15px;border:2px solid}
.turn.you{background:#1f6b32;border-color:#5fe07a;color:#eaffee;animation:glow 1.6s infinite}@keyframes glow{50%{box-shadow:0 0 12px #5fe07a}}
.turn.foe{background:#6b1f1f;border-color:#ff7a6a;color:#ffe6e2}
.turn.over{opacity:.8}
.foeturn .hand,.foeturn .board{opacity:.6;pointer-events:none}
.pips{letter-spacing:1px;color:#6ab7ff}
.btn.nudge{animation:glow2 1.2s infinite}@keyframes glow2{50%{box-shadow:0 0 14px var(--acc)}}
.btn.wait{opacity:.35}
.op.boss{border-color:#e0b030}.rules{font-size:12px;line-height:1.35;background:#000a;border:1px solid var(--ln);border-radius:8px;padding:6px 8px}.rules summary{font-weight:bold;cursor:pointer}
#app>small,#app>h3{background:#000a;border-radius:8px;padding:4px 8px;text-shadow:0 1px 2px #000}
body.menu{background:var(--bg) var(--bgm) center bottom/cover no-repeat fixed}
body.battle{background:var(--bg) var(--bgb) center/cover no-repeat fixed}
.mid{font-size:13px;line-height:1.35;padding:5px 8px;border:1px dashed var(--ln);border-radius:8px;background:#000a}.mid .pr{font-weight:bold;color:var(--acc)}.mid div{opacity:.8}
.bar{display:flex;gap:6px}.bar .hero{flex:1}
.op,.rw{background:#2b2218e6;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:2px solid var(--ln);border-radius:10px}
.rw{padding:5px 8px;font-size:12px}.rw b{flex:1}.rw .btn{padding:1px 9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px 6px}.main .grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
.dkbar{display:flex;flex-direction:column;gap:4px;background:#1b150ff2;border:2px solid var(--ln);border-radius:10px;padding:6px 8px}.dkt{display:flex;justify-content:space-between;font-size:15px}.good{color:#7fe08f}.bad{color:#ff9a7a}.meter{position:relative;height:8px;border-radius:4px;background:#0006;overflow:hidden}.meter i{display:block;height:100%;border-radius:4px}.meter i.good{background:#3fae55}.meter i.bad{background:#c0643a}.meter u{position:absolute;top:0;bottom:0;width:2px;background:#fff9}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{padding:5px 10px;border-radius:16px;font-size:12px;border:1px solid var(--ln);background:#000a;color:var(--fg)}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#bn{flex:1;min-width:0;padding:6px 8px;border-radius:8px;border:1px solid var(--ln);background:#000a;color:var(--fg);font-size:14px}
.cc{display:flex;flex-direction:column;gap:3px}.cc.in .card{box-shadow:0 0 0 2px #5fe07a}.card.full{opacity:.75}.stp{display:flex;align-items:center;justify-content:space-between;font-size:12px;background:#000a;border-radius:8px;padding:1px}.stp span{text-align:center;line-height:1.1}.stp small{display:block;font-size:9.5px}.stp button{width:32px;height:30px;font-size:18px;font-weight:bold;border-radius:8px;border:1px solid var(--ln);background:#2b2218;color:var(--fg)}.stp button:disabled{opacity:.3}
.split{display:flex;gap:6px;align-items:flex-start}.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.dlist{flex:0 0 122px;position:sticky;top:4px;max-height:calc(100vh - 12px);overflow-y:auto;background:#1b150ff2;border:2px solid var(--ln);border-radius:10px;padding:5px;display:flex;flex-direction:column;gap:2px}.dlist h3{margin:0;font-size:13px;display:flex;justify-content:space-between}.dlist h4{margin:5px 0 1px;font-size:11px;color:var(--acc);display:flex;justify-content:space-between;border-bottom:1px solid var(--ln)}
.dl{display:flex;align-items:center;gap:3px;width:100%;padding:3px 2px;font-size:11px;line-height:1.1;text-align:left;background:#2b2218;border:1px solid #0000;border-radius:5px;color:var(--fg)}.dl:active{border-color:var(--acc)}.dl i{flex:0 0 7px;height:7px;border-radius:50%}.dl em{flex:0 0 14px;font-style:normal;font-size:10px;opacity:.75;text-align:center}.dl span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dl b{flex:0 0 auto;color:#7fe08f}.dlist .hint{font-size:9.5px;margin-top:4px}
.sell{font-size:11px;padding:4px 2px;border-radius:8px;border:1px solid #b8921f;background:#3a2f12;color:#ffd96a}.sell small{opacity:.8}.sellall{width:100%;border-color:#b8921f;background:#3a2f12;color:#ffd96a}.sellbox{border-color:#b8921f;flex-wrap:wrap;font-size:13px}
.pip{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000b;color:#fff;font-size:20px;text-align:center;padding:20px;z-index:9}
small{opacity:.8}h3{margin:6px 0 0}
</style></head>
<body><div id="app"></div>
<script>
const SET={name:'First Adventures',size:90};
const SAVE_KEY='delvers2';
const MAXB=6,COLS=4,ROWS=5,NT=COLS*ROWS,BACK=[...Array(COLS).keys()].map(i=>(ROWS-1)*COLS+i),FOEB=[...Array(COLS).keys()];
const KW={heal:'Heals hero 1/turn',regen:'Regenerates 2',keen:'Keen aim: hits 1 easier',haste:'Haste: acts when summoned',dbl:'Two attacks per turn',poison:'Poison: save or +2 dmg',para:'Paralysis: save or lose turn',drain:'Drain: foe loses 1 attack',back:'Backstab: double vs unhurt',mr:'Magic resistance: 50%'};
const imm=c=>c.cls=='U'||c.cls=='K';
const CL={F:['Fighter','#b3402a'],W:['Wizard','#3a62b8'],C:['Cleric','#b8921f'],T:['Thief','#7a4aa8'],R:['Ranger','#3b8a4a'],B:['Beast','#7a6648'],U:['Undead','#5a5a7a'],G:['Giant','#8a5a2b'],D:['Dragon','#b02a4a'],E:['Elemental','#2a8aa0'],K:['Construct','#6b6b6b'],P:['Weapon','#9a4a2a'],A:['Armour','#4a6a9a'],I:['Magic Item','#2f8f8f']};
const RN=['Common','Uncommon','Rare','Legendary'],RC=['#8a8a8a','#3b8a4a','#3a62b8','#c98a1a'];
// name,class,cost,attack,health,THAC0,AC,initiative (movement),save,rarity,alignment,keyword,reach (default 1)
const CR=[
['Squire','F',1,1,2,20,8,1,16,0,'LG'],['Town Guard','F',2,2,3,19,6,1,15,0,'LN'],['Orc Raider','F',2,3,1,18,6,2,16,0,'CE','haste'],['Pikeman','F',2,2,2,19,7,1,15,0,'LN','',2],['Dwarf Fighter','F',4,3,5,16,3,1,10,1,'LG','dbl'],['Paladin','F',5,4,5,15,2,1,11,2,'LG','heal'],
['Apprentice','W',1,1,1,20,9,1,13,0,'NG'],['Illusionist','W',3,2,3,19,8,2,11,1,'N'],['Evoker','W',4,3,2,18,8,1,10,1,'N','',2],['Archmage','W',6,4,5,13,4,1,7,2,'NG','mr',2],
['Acolyte','C',2,1,3,19,7,1,12,0,'LG','heal'],['Priest','C',4,2,5,18,5,1,10,1,'NG','heal'],['War Cleric','C',3,3,3,17,4,1,11,1,'LN'],['High Priestess','C',6,3,6,16,4,1,8,2,'LG','heal'],
['Cutpurse','T',1,1,1,20,7,3,14,0,'CN'],['Goblin Skulker','T',1,1,2,19,6,2,15,0,'NE'],['Cat Burglar','T',2,2,1,18,6,3,13,1,'CN','back'],['Assassin','T',4,4,2,15,5,3,12,2,'LE','back'],
['Woodsman','R',2,2,2,18,7,2,14,0,'NG'],['Hunter','R',2,2,2,19,7,2,14,0,'N','',2],['Elven Ranger','R',3,2,3,14,5,2,13,1,'CG','keen',2],['Beastmaster','R',5,3,4,15,5,2,11,2,'CG','',2],
['Giant Rat','B',1,1,1,20,7,2,15,0,'N'],['Dire Wolf','B',3,3,3,17,6,3,15,0,'N','haste'],['Giant Spider','B',4,3,3,16,4,2,12,1,'CE','poison'],['Owlbear','B',5,4,6,16,5,2,13,1,'N'],['Griffon','B',5,4,4,15,4,3,11,2,'N'],
['Skeleton','U',3,2,4,18,7,1,14,0,'NE'],['Zombie','U',2,2,3,19,8,1,16,0,'NE'],['Ghoul','U',4,3,4,17,6,2,13,1,'CE','para'],['Wight','U',5,4,5,15,5,2,10,2,'LE','drain'],['Lich','U',7,5,6,13,0,1,6,3,'LE','regen',2],
['Ogre','G',5,5,5,17,5,1,14,1,'CE'],['Hill Giant','G',6,5,6,16,4,1,12,2,'CE','',2],['Troll','G',6,5,6,15,4,1,12,2,'CE','regen'],['Cyclops','G',7,6,7,14,3,1,10,2,'CN','',2],
['Pseudodragon','D',2,1,2,19,5,3,12,1,'NG','mr'],['Wyvern','D',4,3,4,16,4,3,11,2,'N','poison',2],['Red Dragon','D',8,7,8,11,-1,3,6,3,'CE','mr',2],
['Fire Elemental','E',4,4,3,16,5,2,12,1,'N'],['Air Elemental','E',4,3,3,16,3,3,12,1,'N','',2],['Earth Elemental','E',5,4,6,16,2,1,11,2,'N'],
['Gargoyle','K',3,2,3,17,4,2,13,1,'CE'],['Gelatinous Cube','K',4,3,6,18,8,1,14,1,'N'],['Clay Golem','K',5,4,6,15,3,1,9,2,'N','mr']
].map(a=>({t:'c',name:a[0],cls:a[1],cost:a[2],atk:a[3],hp:a[4],thac0:a[5],ac:a[6],init:a[7],save:a[8],rar:a[9],al:a[10],kw:a[11]||'',rch:a[12]||1}));
// name,class,cost,rarity,target,kind,amount,text
const SP=[
['Magic Missile','W',1,0,'any','dmg',3,'3 dmg, no attack roll. Save halves.'],['Burning Hands','W',2,0,'any','dmg',4,'4 dmg. Save halves.'],['Lightning Bolt','W',3,1,'any','dmg',5,'5 dmg. Save halves.'],
['Fireball','W',4,2,'none','aoe',3,'3 dmg to all enemy creatures. Save halves.'],['Cone of Cold','W',5,2,'none','aoe',4,'4 dmg to all enemy creatures. Save halves.'],['Meteor Swarm','W',7,3,'none','aoe',6,'6 dmg to all enemy creatures. Save halves.'],
['Sleep','W',2,1,'enemyC','sleep',1,'Foe skips its next turn. Save negates.'],['Hold Person','W',3,2,'enemyC','sleep',2,'Foe skips its next 2 turns. Save negates.'],
['Cure Light Wounds','C',1,0,'ally','heal',4,'Heal 4.'],['Cure Serious Wounds','C',3,1,'ally','heal',8,'Heal 8.'],['Bless','C',2,0,'allyC','bless',1,'+1 attack, +1 health.'],['Smite','C',3,1,'enemyC','dmg',4,'4 dmg to a creature. Save halves.'],
['Potion of Healing','I',1,0,'ally','heal',5,'Heal 5.'],['Potion of Heroism','I',2,1,'allyC','bless',2,'+2 attack, +2 health.'],['Potion of Speed','I',2,1,'allyC','haste',0,'The creature refreshes: it may move and attack again this turn.'],['Wand of Lightning','I',4,2,'any','dmg',6,'6 dmg. Save halves.']
].map(a=>({t:'s',name:a[0],cls:a[1],cost:a[2],rar:a[3],tg:a[4],kind:a[5],n:a[6],txt:a[7],sub:a[1]=='I'?'Magic Item':'Spell'}));
const GT=d=>[d.atk&&`+${d.atk} attack`,d.thac0&&(d.thac0<0?`+${-d.thac0} to hit`:`${-d.thac0} to hit`),d.ac&&`AC ${d.ac}`,d.hp&&`+${d.hp} health`,d.init&&`+${d.init} initiative`,d.rch&&`+${d.rch} reach`,d.save&&`Save ${d.save}`,d.kw&&KW[d.kw]].filter(Boolean).join(', ');
// name,class (P weapon, A armour, I magic),cost,rarity,effects. A creature carries one weapon and one armour.
const IT=[
['Dagger','P',1,0,{atk:1}],['Club','P',1,0,{atk:2,thac0:1}],['Spear','P',2,0,{atk:1,rch:1}],['Rapier','P',2,1,{atk:1,thac0:-1,init:1}],['Long Sword','P',2,1,{atk:2,thac0:-1}],['Halberd','P',3,1,{atk:2,rch:1}],['Longbow','P',3,1,{atk:1,thac0:-2,rch:1}],['War Hammer','P',3,2,{atk:3}],['Flame Tongue','P',4,2,{atk:3,thac0:-2}],['Vorpal Blade','P',5,3,{atk:4,thac0:-3}],
['Leather Armor','A',1,0,{ac:-1,hp:1}],['Shield','A',1,0,{ac:-2}],['Chain Mail','A',2,1,{ac:-3}],['Tower Shield','A',2,1,{ac:-2,hp:2}],['Scale Mail','A',3,1,{ac:-4}],['Mithril Shirt','A',3,2,{ac:-3,init:1}],['Plate Armor','A',4,2,{ac:-5,hp:2}],['Dragonscale Mail','A',5,3,{ac:-6,hp:3,save:-2}],
['Boots of Speed','I',2,1,{init:1,kw:'haste'}],['Cloak of Elvenkind','I',2,1,{ac:-1,init:1}],['Amulet of Health','I',2,1,{hp:3}],['Rod of Reaching','I',2,1,{rch:1}],['Bracers of Defense','I',3,1,{ac:-2,save:-1}],['Ring of Protection','I',3,2,{ac:-1,save:-2}],['Gauntlets of Ogre Power','I',3,2,{atk:2}],['Staff of Striking','I',3,2,{atk:2,thac0:-1,rch:1}],['Winged Boots','I',4,2,{init:2}],['Ring of Regeneration','I',5,3,{hp:2,kw:'regen'}],['Orb of Dragonkind','I',6,3,{atk:3,hp:3,ac:-2}]
].map(a=>({t:'i',name:a[0],cls:a[1],cost:a[2],rar:a[3],tg:'allyC',kind:'gear',d:a[4],txt:GT(a[4]),sub:CL[a[1]][0],slot:a[1]}));
const ALL=[...CR,...SP,...IT],BN={};ALL.forEach(c=>BN[c.name]=c);
// name,hero health,AI level,max rarity,reward,bonus mana,favoured creature types
const OP=[
['Grik the Cutpurse',14,0,0,40,0,['T','R'],'Rustfang Cutpurse','Act I · The Underhalls','The first rung of the Underhalls is a goblin warren under the ruined Gatemarket. Grik has skimmed the pouch of every Delver who ever came down, and he swears the Embershards are his by right of tax.','Grik’s purse holds a scorched map scrap stamped with a deserter’s sigil. The way down continues along the Ashen Road.','“Pay the toll, Delver. There is always a toll.”'],
['Mara, Bandit Captain',18,1,1,60,0,['T','F','R'],'Captain of the Ashen Road','Act I · The Underhalls','Mara Voss was a Dawnguard captain until the Sunforge dimmed and her company was left to starve. She now holds the Ashen Road with deserters and cutthroats. “The Throne starves us and calls it duty,” she says.','Mara lowers her blade. “Tell the Throne its captain is not dead. Only unpaid.” She marks the Gutter-Horde’s drums on your map.','“Loyalty is a luxury, friend. I sold mine for bread.”'],
['Gnarlfang, Goblin Chieftain',20,1,1,75,0,['T','F','B'],'Chieftain of the Gutter-Horde','Act I · The Underhalls','Gnarlfang united the goblin tribes with the Roar, a war-frenzy that spreads through the drums. His wolves and ogres hold the last stairway out of the warrens. Behind him the air tastes of old smoke.','The drums fall silent. In Gnarlfang’s trophy pile you find a cold, whispering shard stamped with the Pale Court’s mark.','“ROAR! The Delver breaks like all the others!”'],
['Vorn, Lich’s Apprentice',22,1,2,90,0,['W','U'],'Apprentice of the Pale Lich','Act II · The Hollow Court','Past the warrens lies the Hollow Court, where the Dusk Gate bleeds shadow into stone. Vorn, apprentice to the Pale Lich Mortisan, needs Embershards for his master’s phylactery. He is a coward wearing borrowed power.','Vorn’s borrowed power unravels. “Master will not forgive this,” he whimpers as his bone-servants crumble.','“Master promised me eternity. You will make a fine servant.”'],
['Brother Malachar',24,1,2,110,0,['C','U'],'Ashen Confessor','Act II · The Hollow Court','Brother Malachar once burned heretics for the Ember Faith. The Hollow took him, and now he preaches that the Dusk is mercy. His pilgrims shamble in a procession of ash and candle-smoke.','Malachar kneels in the ash. “The light … was only ever a fire. Let it be a good one.” His censer rolls to your feet, still warm.','“Be still, child. The Dusk forgives everything.”'],
['Dugash the Orc Warlord',26,2,2,130,1,['F','G','B'],'Warlord of the Skarhorde','Act III · The Deep Roads','The orc clans of the Skarhorde were honourable once. Then they drank a blood-pact from the demon-lords of the Hollow. Dugash now marches the whole Horde toward Hallowspire, and only the Deep Roads stand between them and the Throne.','Dugash drops to one knee. “You fight with honour. The pact took mine.” He breaks his axe and lets you pass, though the Horde marches on.','“Blood and iron! Your skull will hold my wine!”'],
['Hrothgar Stonefist',28,2,2,150,1,['G','B'],'Last of the Cairn-Kings','Act III · The Deep Roads','The stone giants swore an oath to the First Dwarves to guard the Deep Anvil where the Sunforge was cast. Hrothgar has kept it for ten thousand years and takes every Delver for a thief.','Hrothgar sets down his hammer. “The oath is kept, small one. Go.” He opens the gate to the Lowdeep.','“No thief shall touch the Anvil. I have counted every one.”'],
['Sylra, Drow Matron',30,2,3,180,1,['T','W','B'],'Matron of the Spiderthrone','Act III · The Deep Roads','In the Lowdeep, Matron Sylra spins webs of Hollow-silk and sells secrets to every side. She sold the Dusk Gate’s location to the Horde. She will sell yours too.','Sylra shrugs as her webs burn. “Business is business, Delver. Take this. It is a gift, not a bribe.” It is the key to the Conclave’s foundry.','“Everyone is for sale, little Delver. Even you.”'],

document.documentElement.style.setProperty('--bgm',BGM);document.documentElement.style.setProperty('--bgb',BGB);
function card(c,attr,cls,n){const k=c.t=='c';return `<button class="card ${cls||''}" style="--k:${CL[c.cls][1]}" ${attr||''}><span class="cost ${/\bno\b/.test(cls||'')?'no':''}">${c.cost}</span><b>${c.name}</b>${art(c)}<em>${k?`${CL[c.cls][0]} · ${c.al}${KW[c.kw]?'<br>'+KW[c.kw]:''}${c.rch>1?'<br>Reach '+c.rch:''}`:c.txt}</em>${k?`<span class="st"><u>⚔${c.atk}</u><u>♥${c.hp}</u></span><small>AC ${c.ac} · THAC0 ${c.thac0}<br>Init ${c.init} · Save ${c.save}</small>`:`<small>${c.sub}</small>`}<i class="rar" style="background:${RC[c.rar]}"></i>${n!=null?`<s>×${n}</s>`:''}</button>`}
const need=(a,ac)=>Math.min(20,Math.max(2,a.thac0-ac-(a.kw=='keen'?1:0)));
function canPlay(c){const P=G.p;if(c.cost>P.mp)return false;if(c.t=='c')return BACK.some(i=>!G.b[i]);if(c.tg=='none')return true;
 return[{side:'p',c:null},{side:'e',c:null},...G.b.filter(Boolean).map(u=>({side:u.o,c:u}))].some(t=>ok(c.tg,'p',t,c))}
function gameHTML(){const P=G.p,E=G.e,sel=G.sel,sp=sel&&sel.m=='spell'?sel.c:null,un=sel&&sel.m=='unit'?sel.c:null,up=un?G.b.indexOf(un):-1,pl=sel&&sel.m=='place',mine=G.turn=='p'&&!G.over;
 const hl=(side,c)=>sp&&ok(sp.tg,'p',{side,c},sp)?'tgt':'';
 const pips=(m,x)=>`<span class="pips" aria-label="mana ${m} of ${x}">${'●'.repeat(m)}${'○'.repeat(Math.max(0,x-m))}</span>`;
 const hh=un&&un.ready&&row(up)<un.rch;
 const eh=`<button class="hero ${hl('e',null)||(hh?'tgt':'')}" data-a="ehero">${G.opp.n}<span>${hh?`<b style="color:#ff8a7a">🎯 ${need(un,10)}+ to hit</b> · `:''}❤ ${E.hp} · ✦ ${E.mp}/${E.max} · hand ${E.hand.length} · deck ${E.deck.length}</span></button>`;
 const bd=G.b.map((u,i)=>{if(!u){const m=(un&&dist(up,i)<=un.mv)||(pl&&row(i)==ROWS-1);return `<button class="tile ${m?'mv':''}" data-a="cell" data-i="${i}">${m?(pl?'▼ place here':'move →'):row(i)==0?'· foe ·':row(i)==ROWS-1?'· you ·':''}</button>`}
  const inr=un&&u.o=='e'&&un.ready&&dist(up,i)<=un.rch,tg=hl(u.o,u)||(inr?'tgt':'');
  const cl=(u.o=='p'&&mine&&(u.mv>0||u.ready)&&!sel?'ready ':'')+(sel&&sel.c===u?'sel ':'')+(u.sleep||(u.o=='p'&&mine&&!u.ready&&u.mv<=0)?'done ':'')+tg;
  return `<button class="tile u ${u.o} ${cl}" style="--k:${CL[u.cls][1]}" data-a="cell" data-i="${i}">${inr?`<i class="hit">🎯${need(un,u.ac)}+</i>`:''}${art(u,'tart')}<b>${u.name}</b><span>⚔${u.atk} ♥${u.hp}${u.rch>1?' R'+u.rch:''}${u.sleep?' 💤':''}</span><span>AC${u.ac} T${u.thac0} Init ${u.mv}/${u.init}</span></button>`}).join('');
 const pr=G.over?'':G.turn=='e'?'Foe is acting… please wait.':G.msg||(pl?'Tap a glowing tile on your back row (bottom).':sp?`Choose a target for ${sp.name}.`:un?`Tap a yellow tile to move (${un.mv} initiative left)${un.ready?', or a red target to attack':''}.`:'Tap a glowing green card to play it, or a green-outlined creature to move or attack.');
 const hd=P.hand.map((c,i)=>{const ok_=mine&&canPlay(c);return card(c,`data-a="hand" data-i="${i}"`,(sel&&sel.c===c?'sel ':'')+(ok_?(sel?'':'can '):'dim ')+(c.cost>P.mp?'no':''))}).join('');
 const idle=mine&&!G.busy&&!P.hand.some(canPlay)&&!units('p').some(u=>u.ready);
 const tb=G.over?'<div class="turn over">Battle over</div>':mine?'<div class="turn you">⚔ YOUR TURN</div>':'<div class="turn foe">⏳ FOE’S TURN</div>';
 return `<div class="${mine?'':'foeturn'}" style="display:contents">${tb}${eh}<div class="board">${bd}</div><div class="mid"><div class="pr">${pr}</div>${G.log.slice(0,2).map(l=>`<div>${l}</div>`).join('')}${V.saveMsg?`<div role="alert">${V.saveMsg}</div>`:''}<div style="opacity:.7">To hit: roll d20 ≥ THAC0 − target AC (🎯 shows the number needed).</div></div><div class="bar"><button class="hero ${hl('p',null)}" data-a="phero">You<span>❤ ${P.hp} · ✦ ${pips(P.mp,P.max)} ${P.mp}/${P.max} · deck ${P.deck.length}</span></button><button class="btn pri ${idle?'nudge':''} ${mine?'':'wait'}" data-a="end" ${mine?'':'disabled'}>End turn</button><button class="btn" data-a="quit">Quit</button></div><div class="hand">${hd}</div></div>`
 +(G.over?`<div id="ov"><div>${G.res}</div><button class="btn pri" data-a="quit">Continue</button></div>`:'')}
const GUIDE=[
['The goal',`<p>Each duel is a fight between you and a foe. Every hero has Health. <b>Reduce the enemy hero to 0 Health to win.</b> If your own hero reaches 0 you are defeated, but you still earn a little gold and can try again.</p><p>Your hero starts with 20 Health. Foes have more as the campaign goes on.</p>`],
['A turn, step by step',`<ol><li><b>Start of turn:</b> your Mana refills (and its maximum rises by 1, up to 10), you draw a card, and your creatures wake up with full Initiative and the ability to attack.</li><li><b>Play cards</b> from your hand by spending Mana. Tap a card, then tap where it should go or what it should target.</li><li><b>Move and attack</b> with your creatures. Tap a creature with a green outline, then a yellow tile to move or a red target to attack.</li><li><b>End turn.</b> The foe takes its turn, then it is yours again.</li></ol><p>The big banner at the top always says whose turn it is. When it is not yours, your hand fades and taps do nothing.</p>`],
['Mana (✦)',`<p>Cards cost Mana (the number in the corner). You begin the duel with 0 maximum Mana and gain 1 each turn, so turn 3 gives 3 Mana. It all refills every turn and unspent Mana is lost. A card with a red cost is too expensive right now.</p>`],
['The 4×5 grid',`<p>The battlefield is a grid 4 tiles wide and 5 tiles tall. The <b>top row is the foe's back row</b> and the <b>bottom row is yours</b>. The three rows between are no-man's-land. Your creatures always start on your bottom row.</p><p>Only one creature fits on a tile. Creatures never leave the grid on their own: they stay until they fall or the duel ends.</p>`],
['Summoning creatures',`<p>Play a creature card, then tap a glowing tile on your bottom row. A newly summoned creature is <b>tired</b>: it cannot move or attack until your next turn.</p>`],
['Initiative (movement)',`<p>Initiative is how many tiles a creature can move each turn, one step at a time up, down, left or right (no diagonals). The tile shows <b>Init 1/2</b>: 1 left out of 2. You may split your movement, and move before or after attacking.</p>`],
['Reach and attacking',`<p><b>Reach</b> is how many tiles away a creature can strike (counted the same way as movement, with no diagonals). Most creatures have Reach 1, so they must be next to their target. Reach-2 creatures (archers, pikemen, spear-users) can hit from two tiles away.</p><ul><li>Each creature attacks <b>once per turn</b>.</li><li>To hit the <b>enemy hero</b>, get to the foe's side of the grid: a creature with Reach 1 must stand on the top row, with Reach 2 it can attack from the second row from the top. Then tap the foe's hero bar.</li><li><b>Retaliation:</b> after you attack a creature, it strikes back <em>only if you are within its own Reach</em> and it survived. A Reach-2 archer shooting a Reach-1 fighter from two tiles away takes no counterattack. Heroes never retaliate.</li></ul>`],
['Hitting: THAC0 and Armour Class',`<p>This game uses the rules of 2nd-edition Dungeons &amp; Dragons.</p><ul><li><b>THAC0</b> means "To Hit Armour Class 0": the d20 roll an attacker needs to hit a target with AC 0. A lower THAC0 is better.</li><li><b>Armour Class (AC)</b> is how hard a target is to hit. A <em>lower</em> AC is better, and AC can go below 0. Heroes have AC 10.</li></ul><p><b>To hit, roll a d20 and get at least THAC0 − target's AC.</b> The 🎯 tags in battle show the exact number needed.</p><p><i>Example:</i> a Squire (THAC0 20) attacks a Skeleton (AC 7). Needed: 20 − 7 = 13, so the Squire hits on a 13 or higher (40% of the time). Against a Knight with AC −2 the roll would be 22, which is capped at 20.</p><ul><li><b>Natural 20</b> always hits and does <b>double damage</b>.</li><li><b>Natural 1</b> always misses.</li><li>The needed number is never below 2 or above 20.</li></ul><p>Damage is the attacker's ⚔ Attack value. A creature at 0 ♥ is removed from the grid.</p>`],
['Saving throws',`<p>Many spells let the target make a <b>Save</b>. Roll a d20: if you roll the target's Save number or higher, it resists. A <b>lower Save is better</b>. Damage spells deal half damage (rounded down) on a save, and Sleep and Hold Person do nothing. Heroes get no save, so damage spells always hit them fully.</p>`],
['Creature abilities',`<p>Many creatures carry an ability, shown on the card and in the glossary. Inspired by 2nd-edition D&amp;D monsters and magic:</p><ul><li><b>Haste:</b> acts the turn it is summoned.</li><li><b>Two attacks:</b> attacks twice per turn (each target may retaliate).</li><li><b>Poison:</b> a creature it hits must make a Save or take 2 more damage.</li><li><b>Paralysis:</b> a creature it hits must make a Save or lose its next turn.</li><li><b>Drain:</b> a creature it hits permanently loses 1 Attack.</li><li><b>Backstab:</b> one extra damage multiple against an unhurt target.</li><li><b>Magic resistance:</b> half of all hostile spells fizzle against it.</li><li><b>Undead and Constructs</b> are immune to Sleep, Hold, Poison and Paralysis.</li><li><b>Keen, Heal, Regenerate</b> as in the glossary.</li></ul>`],
['Spells, potions and magic items',`<p>Spells and potions are used once and then go away. Some need a target (tap the glowing one) and some (like Fireball) simply go off when you play them. Damage spells ignore AC: they never miss.</p>`],
['Weapons, armour and gear',`<p>Gear cards are played on one of <b>your creatures</b> and stay for the rest of the duel. Each creature may carry <b>one weapon, one armour and one magic item</b>. A creature that falls takes its gear with it. If a creature already has that kind of gear you cannot add another.</p><p>Gear boosts a stat: more Attack, lower THAC0, lower AC, extra Health, Initiative, Reach or Save.</p>`],
['Cards &amp; Deck tab',`<p>Your collection and deck builder share one screen. Tap a card (or its +/− buttons) to add or remove it. The bar at the top shows how full your deck is and turns green at 20 cards. Use the filter chips to show creatures, spells, gear or only the cards in your deck. <b>Saved builds</b> keep up to 6 named decks you can load later. The list on the right shows every card in your deck, grouped by type; tap a row to remove one copy.</p><p><b>Selling spares:</b> a deck holds at most 3 copies of a card, so any copies beyond 3 are spare. Sell them one at a time or all at once for gold: Common 🪙5, Uncommon 🪙15, Rare 🪙40, Legendary 🪙100. You always keep 3 copies of every card you own.</p>`],
['Building your deck',`<ul><li>A deck holds <b>up to 30 cards</b>. You need <b>at least 20</b> to fight.</li><li>You may include up to <b>3 copies</b> of a card, if you own that many.</li><li>You draw 3 cards at the start (and the foe 4) and 1 more each turn. Your hand holds <b>7</b>; extra draws are lost.</li><li>If you try to draw from an empty deck you take <b>2 damage</b> instead (fatigue).</li><li>"Auto" builds a balanced deck for you: mostly cheap creatures, then spells and gear.</li></ul>`],
['Campaign, rewards and packs',`<p>Story mode is 36 encounters across 5 acts: 24 <b>skirmishes</b> and 12 <b>bosses</b>. Beat each in order to unlock the next. Winning for the first time gives gold (×1.5); replays give normal gold; losing gives 15 gold. <b>Boss</b> fights also give a free pack the first time you win.</p><p>In the Store, buy as many packs as you like for 🪙100 each. A pack has 5 cards and at least 1 Uncommon. Open them from the Packs tab. Your progress saves automatically on this device.</p>`],
['Tips for new Delvers',`<ul><li>Keep a spread of cheap creatures so you can play something every turn.</li><li>Use Reach-2 creatures behind a front line: they hit without being hit back.</li><li>Check the 🎯 number before attacking: a 15+ is risky. Put armour on your best creatures.</li><li>Heal your hero or kill their damage dealers before the foe reaches your side of the grid.</li><li>Sleep and Hold Person on the biggest attacker buy you several turns.</li><li>Stuck on a boss? Spend gold on packs, then press Auto build in the Cards & Deck tab, or sell spare cards for gold, or replay earlier fights for gold.</li></ul>`]];
const GLOSS=[['AC (Armour Class)','How hard a target is to hit. Lower is better; heroes have AC 10.'],['Alignment','A flavour label such as LG (Lawful Good) or CE (Chaotic Evil). It has no effect on gameplay.'],['Armour','Gear that lowers AC and often adds Health. One per creature.'],['Attack (⚔)','The damage a creature deals when it hits.'],['Back row','The row of tiles closest to a hero. You summon creatures on yours.'],['Backstab (keyword)','Deals an extra damage multiple against a target that has taken no damage.'],['Boss','A named foe at the end of each group of skirmishes. Gives a free pack the first time you win.'],['Class / type','What a creature is: Fighter, Wizard, Cleric, Thief, Ranger, Beast, Undead, Giant, Dragon, Elemental or Construct. Foes favour certain types.'],['Cost','The Mana you must spend to play a card (number in the corner).'],['Build','A saved, named deck you can load later from the Cards & Deck tab.'],['Critical hit','A natural 20: always hits and deals double damage.'],['d20','A twenty-sided die. The game rolls it for you.'],['Drain (keyword)','A creature it hits permanently loses 1 Attack.'],['Fatigue','Drawing from an empty deck: you take 2 damage instead.'],['Gear','Weapon, armour and magic item cards that permanently boost a creature.'],['Haste (keyword)','The creature may move and attack on the turn it is summoned.'],['Health (♥)','How much damage a creature or hero can take before falling.'],['Heal (keyword)','Heals your hero for 1 at the start of each of your turns.'],['Initiative','Movement. The number of tiles a creature can move each turn.'],['Keen aim (keyword)','The attacker needs 1 less on the d20 to hit.'],['Magic item','A potion, wand or enchanted item. Gear versions stay on a creature; potions and wands are used once.'],['Mana (✦)','The resource you spend to play cards. Refills each turn and the maximum grows to 10.'],['Magic resistance (keyword)','Half of all hostile spells fizzle against this creature.'],['Natural 1 / 20','The raw d20 result before any modifiers. A natural 1 always misses; a natural 20 always hits.'],['Immunity','Undead and Constructs ignore Sleep, Hold, Poison and Paralysis.'],['Paralysis (keyword)','A creature it hits must make a Save or skip its next turn.'],['Poison (keyword)','A creature it hits must make a Save or take 2 more damage.'],['Spare card','A copy of a card beyond the 3 you can use in a deck. Spares can be sold for gold (Common 5, Uncommon 15, Rare 40, Legendary 100).'],['Pack','5 random cards. Bought in the Store, opened in the Packs tab.'],['Rarity','Common (grey), Uncommon (green), Rare (blue) or Legendary (gold), shown by the dot on a card.'],['Two attacks (keyword)','The creature may attack twice each turn.'],['Reach','How many tiles away a creature can attack. Default 1.'],['Regenerate (keyword)','The creature heals 2 Health at the start of each of your turns.'],['Retaliation','A creature hit in combat strikes back, but only if the attacker is within its own Reach.'],['Save','A d20 roll to resist a spell. Roll the number or higher to succeed; lower is better.'],['Skirmish','An ordinary campaign fight, easier than the boss that follows.'],['Sleep / Hold','A sleeping creature cannot move or attack for its next turn(s). Saves negate it.'],['Slot','Each creature can carry one weapon, one armour and one magic item.'],['Summoning','Playing a creature onto your back row. It cannot act until your next turn.'],['THAC0','"To Hit Armour Class 0": the d20 roll needed to hit AC 0. Lower is better. Roll at least THAC0 − target AC to hit.'],['Weapon','Gear that adds Attack and/or improves THAC0. One per creature.']];
function guideHTML(){return `<small>New here? Tap a section to read it.</small>`+GUIDE.map((g,i)=>`<details class="rules" ${i==0?'open':''}><summary>${g[0]}</summary>${g[1]}</details>`).join('')+`<details class="rules"><summary>Glossary of game terms</summary>${GLOSS.map(t=>`<p><b>${t[0]}</b>: ${t[1]}</p>`).join('')}</details>`}
const WORLD=[['The Ember Throne','For ten thousand years the God-King Aurelian the Undying has sat the Ember Throne in the cathedral-fortress of Hallowspire. He is sustained by the Sunforge, a vast engine of light built by the First Dwarves. Its radiance holds back the Hollow.'],
['The Long Dusk','The Sunforge is failing. At the edge of its light the Dusk Gate has cracked, and the Hollow, a plane of hunger and shadow, seeps into Vaelmark. The dead walk, the Skarhorde marches, dragons wake. In the grim dark of the Long Dusk, there is only war.'],
['The Delvers','The Delvers’ Guild licenses mercenaries, heretics and fools to descend into the Underhalls, the ruined cities, tombs and vaults beneath Vaelmark, and recover Embershards to feed the Sunforge. A Delver fights with steel, spells and the old rule of the d20: THAC0.'],
['The Powers','The Dawnguard (the Throne’s armoured knights), the Skarhorde (orc clans bound by blood-pact), the Cogwright Conclave (magic fused with machine), the Cinder Brood (dragons), the Pale Court (the undead), the Spiderthrone (drow), the Cairn-Kings (giants) and the Rustfang goblins all want the Sunforge: to keep it, to feed on it, or to put it out.']];
function loreHTML(){return WORLD.map(w=>`<div class="op" style="display:block"><b>${w[0]}</b><br><small>${w[1]}</small></div>`).join('')+'<h3>Dossiers</h3>'+OP.map((o,i)=>{const k=i*3+2,seen=S.prog>=k;return `<div class="op ${seen?'':'dim'}" style="display:block"><b>${seen?'👑 '+o[0]:'??? (Boss '+(i+1)+')'}</b><br><small>${seen?o[7]+' · '+o[8]+'<br>'+o[9]+'<br><i>Defeated:</i> '+o[10]:'Reach this boss to learn their story.'}</small></div>`}).join('')}
function briefHTML(){const o=CAMP[V.brief];return `<div class="op" style="display:block"><small>${o[8]}</small><h3 style="margin:2px 0">${o[12]?'👑 ':''}${o[0]}</h3><small><b>${o[7]}</b> · ❤ ${o[1]} · 🪙 ${o[4]}<br>Fields: ${o[6].map(c=>CL[c][0]).join(' / ')}</small><p style="line-height:1.4">${o[9]}</p></div><div class="bar"><button class="btn pri" style="flex:1" data-a="begin">Begin duel</button><button class="btn" data-a="back">Back</button></div>`}
const SELL=[5,15,40,100],KEEP=3,xtra=c=>Math.max(0,own(c.name)-KEEP),xtraAll=()=>ALL.reduce((a,c)=>{const e=xtra(c);return[a[0]+e,a[1]+e*SELL[c.rar]]},[0,0]);

function cardsHTML(){const n=S.deck.length,dc=x=>S.deck.filter(y=>y==x).length,f=V.f||'all',cnt=t=>S.deck.filter(x=>BN[x].t==t).length,
 pct=Math.min(100,Math.round(n/30*100)),st=n<20?`Needs ${20-n} more to fight`:n>=30?'Deck full':'✔ Ready to fight',
 list=ALL.filter(c=>(V.un||own(c.name))&&(f=='all'||(f=='d'?dc(c.name)>0:c.t==f))).sort((a,b)=>a.cost-b.cost||a.name.localeCompare(b.name)),
 o=ALL.filter(c=>own(c.name)).length,
 bl=S.builds.map((b,k)=>`<div class="rw"><b>${b.name} <small>${b.deck.length} cards</small></b><button class="btn" data-a="bload" data-i="${k}">Load</button><button class="btn" data-a="bdel" data-i="${k}" aria-label="Delete ${b.name}">🗑</button></div>`).join('');
 const xa=xtraAll(),selb=xa[0]?(V.cs?`<div class="op sellbox"><span>Sell ${xa[0]} spare cards for 🪙${xa[1]}?</span><span><button class="btn pri" data-a="sellall">Confirm</button> <button class="btn" data-a="sellno">Cancel</button></span></div>`:`<button class="btn sellall" data-a="sellask">💰 Sell all spare cards (${xa[0]}) → 🪙${xa[1]}</button>`):'<small>No spare cards. You keep 3 copies of each card; extras can be sold for gold.</small>',
 grp=[['c','Creatures'],['s','Spells'],['i','Gear']].map(([t,nm])=>{const u=[...new Set(S.deck.filter(x=>BN[x].t==t))].sort((a,b)=>BN[a].cost-BN[b].cost||a.localeCompare(b));return u.length?`<h4>${nm} <small>${cnt(t)}</small></h4>`+u.map(x=>`<button class="dl" data-a="dm" data-i="${ALL.indexOf(BN[x])}" aria-label="Remove one ${x}"><i style="background:${RC[BN[x].rar]}"></i><em>${BN[x].cost}</em><span>${x}</span><b>×${dc(x)}</b></button>`).join(''):''}).join(''),
 side=`<aside class="dlist"><h3>In deck <small>${n}/30</small></h3>${grp||'<small>Empty. Tap cards to add them.</small>'}<small class="hint">Tap a row to remove one copy.</small></aside>`;
 return `<div class="dkbar"><div class="dkt"><b>Deck ${n}/30</b><span class="${n<20?'bad':'good'}">${st}</span></div><div class="meter"><i style="width:${pct}%" class="${n<20?'bad':'good'}"></i><u style="left:${20/30*100}%"></u></div><small>${cnt('c')} creatures · ${cnt('s')} spells · ${cnt('i')} gear · max 3 copies · 20 minimum</small><div class="bar"><button class="btn" data-a="auto">Auto build</button><button class="btn" data-a="clear" ${n?'':'disabled'}>Clear</button></div></div>
 <details class="rules" ${V.bo?'open':''}><summary data-a="btog">Saved builds (${S.builds.length}/${MAXB})</summary>${bl||'<small>No builds yet. Save your current deck to switch between decks quickly.</small>'}<div class="bar" style="margin-top:6px"><input id="bn" maxlength="20" placeholder="Build name" aria-label="Build name"><button class="btn pri" data-a="bsave" ${S.builds.length>=MAXB||!n?'disabled':''}>Save deck as build</button></div></details>
 <div class="split"><div class="main">
 <div class="chips">${Object.keys(FL).map(k=>`<button class="chip ${f==k?'on':''}" data-a="flt" data-k="${k}">${FL[k]}</button>`).join('')}<button class="chip ${V.un?'on':''}" data-a="unl">${V.un?'Hide':'Show'} unowned</button></div>
 <small>${SET.name}: ${o}/${ALL.length} cards found. Tap a card to add it to your deck.</small>${V.sold?`<div class="mid" role="status">${V.sold}</div>`:''}${selb}
 <div class="grid">${list.map(c=>{const k=own(c.name),d=dc(c.name),mx=Math.min(3,k),i=ALL.indexOf(c),fl=d>=mx||n>=30;
  if(!k)return `<div class="cc"><div class="card dim" style="--k:#888"><b>???</b><em>${RN[c.rar]}</em></div></div>`;
  return `<div class="cc ${d?'in':''}">${card(c,`data-a="dp" data-i="${i}"`,fl?'full':'')}<div class="stp"><button data-a="dm" data-i="${i}" ${d?'':'disabled'} aria-label="Remove ${c.name}">−</button><span><b>${d}</b>/${mx}<small> own ${k}</small></span><button data-a="dp" data-i="${i}" ${fl?'disabled':''} aria-label="Add ${c.name}">+</button></div>${xtra(c)?`<button class="sell" data-a="sell" data-i="${i}">Sell 1 extra · 🪙${SELL[c.rar]} <small>(${xtra(c)} spare)</small></button>`:''}</div>`}).join('')||'<small>No cards match this filter.</small>'}</div></div>${side}</div>`}
function menuHTML(){if(V.brief!=null)return briefHTML();const T=[['duel','Duel'],['cards','Cards & Deck'],['store','Store'],['packs','Packs'],['lore','Lore'],['guide','Guide']];
 let h=`<div class="nav">${T.map(t=>`<button data-a="nav" data-v="${t[0]}" class="${V.v==t[0]?'on':''}">${t[1]}</button>`).join('')}<span>🪙 ${S.gold}</span></div><small class="set"><b>${SET.name}</b> · Set 1 · ${ALL.length} cards</small>${V.saveMsg?`<div role="alert" class="mid">${V.saveMsg}</div>`:''}`;
 if(V.v=='duel'){h+=`<div class="op" style="display:block"><b>New to Delvers?</b> <button class="btn" data-a="nav" data-v="guide" style="float:right;padding:2px 10px">Open the Guide</button><br><small>Learn turns, Mana, the grid, Initiative, Reach, abilities and THAC0.</small></div><small>${V.msg||'Beat each foe in order. Summon creatures on your back row of the 4×5 grid, spend initiative to move them, and strike the enemy hero from their side of the grid. Reach lets a creature hit foes that many tiles away, and a foe only strikes back if you are within its reach. Each creature can carry one weapon and one armour.'}</small>`+CAMP.map((o,i)=>(i==0||CAMP[i-1][8]!=o[8]?`<h3>${o[8]}</h3>`:'')+`<div class="op ${i>S.prog?'dim':''} ${o[12]?'boss':''}"><div><b>${o[12]?'👑 ':''}${o[0]}</b><br><small>${o[7]} · ❤ ${o[1]} · 🪙 ${o[4]}${i<S.prog?' · ✔ Cleared':''}<br>Fields: ${o[6].map(c=>CL[c][0]).join(' / ')}</small></div><button class="btn ${i==S.prog?'pri':''}" data-a="fight" data-i="${i}" ${i>S.prog?'disabled':''}>${i>S.prog?'Locked':i<S.prog?'Replay':'Fight'}</button></div>`).join('')}
 else if(V.v=='lore')h+=loreHTML();
 else if(V.v=='guide')h+=guideHTML();
 else if(V.v=='cards')h+=cardsHTML();
 else if(V.v=='store'){const PR=100,mx=Math.max(1,Math.floor(S.gold/PR)),q=Math.min(Math.max(1,V.qty||1),mx);V.qty=q;
  h+=`<div class="op" style="display:block"><b>${SET.name} Pack</b><br><small>5 cards, at least 1 Uncommon. 🪙 ${PR} each.</small><div class="bar" style="margin-top:8px;align-items:center"><button class="btn" data-a="qm" ${q<=1?'disabled':''}>−</button><b style="min-width:2.5em;text-align:center;font-size:18px">${q}</b><button class="btn" data-a="qp" ${q>=mx||S.gold<PR*(q+1)?'disabled':''}>+</button><button class="btn" data-a="qmax" ${S.gold<PR?'disabled':''}>Max</button><button class="btn pri" style="flex:1" data-a="buy" ${S.gold<PR*q?'disabled':''}>Buy ${q} · 🪙 ${PR*q}</button></div></div><small>You own ${S.packs.std} unopened. Open them in the Packs tab.</small>`}
 else{h+=`<div class="op"><b>Packs: ${S.packs.std}</b><span><button class="btn pri" data-a="open" ${S.packs.std?'':'disabled'}>Open 1</button> <button class="btn" data-a="openall" ${S.packs.std>1?'':'disabled'}>Open all</button></span></div>`+(V.rev.length?`<h3>You found ${V.rev.length} cards:</h3><div class="grid">${V.rev.map(c=>card(c,'','',own(c.name))).join('')}</div>`:'<small>Win boss battles or visit the Store to get packs.</small>')}
 return h}
function render(){if(G&&G.over&&!G.fin)finish();document.body.className=G?'battle':'menu';$app.innerHTML=G?gameHTML():menuHTML()}
function packRoll(){const w=[70,22,7,1],o=[];for(let i=0;i<5;i++){let r=Math.random()*100,k=0;for(;k<3;k++){if(r<w[k])break;r-=w[k]}if(i==4)k=Math.max(k,1);o.push(pick(ALL.filter(c=>c.rar==k)))}return o}
const $app=document.getElementById('app');
$app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i,k=b.dataset.k;
 if(G){if(a=='end')endTurn();else if(a=='quit'){if(!G.busy||G.over){G=null;render()}}else handle(a,i);return}
 if(a=='nav'){V.v=b.dataset.v;V.msg='';V.cs=false;V.sold=''}
 else if(a=='fight'){if(S.deck.length<20)V.msg='Your deck needs at least 20 cards. Open the Cards & Deck tab.';else V.brief=i}
 else if(a=='begin'){const b=V.brief;V.brief=null;newGame(b);return}
 else if(a=='back')V.brief=null;
 else if(a=='auto')S.deck=auto();else if(a=='clear')S.deck=[];
 else if(a=='flt')V.f=k;else if(a=='unl')V.un=!V.un;else if(a=='btog'){V.bo=!b.closest('details').open;return}
 else if(a=='bsave'){const nm=(document.getElementById('bn').value||'').trim().slice(0,20)||'Build '+(S.builds.length+1);if(S.builds.length<MAXB&&S.deck.length){S.builds.push({name:nm,deck:[...S.deck]});V.bo=true}}
 else if(a=='bload'){const b2=S.builds[i];if(b2)S.deck=[...b2.deck]}
 else if(a=='bdel')S.builds.splice(i,1);
 else if(a=='sell'){const c=ALL[i];if(c&&xtra(c)){S.col[c.name]--;S.gold+=SELL[c.rar]}}
 else if(a=='sellask')V.cs=true;else if(a=='sellno')V.cs=false;
 else if(a=='sellall'){let g=0;ALL.forEach(c=>{const e=xtra(c);if(e){S.col[c.name]-=e;g+=e*SELL[c.rar]}});S.gold+=g;V.cs=false;V.sold='Sold spare cards for 🪙'+g+'.'}
 else if(a=='dp'){const n=ALL[i].name;if(S.deck.length<30&&S.deck.filter(x=>x==n).length<Math.min(3,own(n)))S.deck.push(n)}
 else if(a=='dm'){const j=S.deck.indexOf(ALL[i].name);if(j>=0)S.deck.splice(j,1)}
 else if(a=='qm')V.qty=Math.max(1,(V.qty||1)-1);else if(a=='qp')V.qty=(V.qty||1)+1;else if(a=='qmax')V.qty=Math.max(1,Math.floor(S.gold/100));
 else if(a=='buy'){const n=Math.min(V.qty||1,Math.floor(S.gold/100));if(n>0){S.gold-=100*n;S.packs.std+=n;V.qty=1}}
 else if((a=='open'||a=='openall')&&S.packs.std){const n=a=='open'?1:S.packs.std;S.packs.std-=n;V.rev=[];for(let j=0;j<n;j++)packRoll().forEach(c=>{V.rev.push(c);S.col[c.name]=own(c.name)+1})}
 sv();render()});
render();
</script></body></html>
