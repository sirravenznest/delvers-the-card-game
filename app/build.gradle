plugins {
    id "com.android.application"
}

def releaseSigning = [
    storeFile: System.getenv("ANDROID_SIGNING_KEYSTORE"),
    storePassword: System.getenv("ANDROID_SIGNING_STORE_PASSWORD"),
    keyAlias: System.getenv("ANDROID_SIGNING_KEY_ALIAS"),
    keyPassword: System.getenv("ANDROID_SIGNING_KEY_PASSWORD")
]
def hasReleaseSigning = releaseSigning.values().every { it }
def requestsRelease = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
if (requestsRelease && !hasReleaseSigning) {
    throw new GradleException("Release signing requires ANDROID_SIGNING_KEYSTORE, ANDROID_SIGNING_STORE_PASSWORD, ANDROID_SIGNING_KEY_ALIAS, and ANDROID_SIGNING_KEY_PASSWORD.")
}

android {
    namespace "com.sirravenznest.delvers"
    compileSdk 35

    defaultConfig {
        applicationId "com.sirravenznest.delvers"
        minSdk 23
        targetSdk 34
        versionCode 28
        versionName "2.2.14"
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
}
