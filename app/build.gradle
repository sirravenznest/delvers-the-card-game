plugins {
    id "com.android.application"
}

android {
    namespace "com.sirravenznest.delvers"
    compileSdk 35

    defaultConfig {
        applicationId "com.sirravenznest.delvers"
        minSdk 23
        targetSdk 34
        versionCode 19
        versionName "2.2.5"
    }

    // The shared debug-grade key keeps one stable signature (and SHA-1 for Google sign-in) across CI builds.
    signingConfigs {
        shared {
            storeFile file("../android-signing/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.shared
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
}
